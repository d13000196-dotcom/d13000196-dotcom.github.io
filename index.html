<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DAP ORDER APK - GOLD EDITION</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Poppins:wght@600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0800;color:#fff;font-family:Poppins,sans-serif;overflow-x:hidden}
canvas#bgCanvas{position:fixed;inset:0;z-index:-2}
.overlay{position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 50% 0%,rgba(255,215,0,.15) 0%,rgba(0,0,0,.95) 70%)}
.wrap{max-width:720px;margin:0 auto;padding:12px;position:relative;z-index:2}
.mp3bar{border:1.5px solid #ffd700;background:linear-gradient(90deg,#0f0f0f,#1a1500);border-radius:12px;padding:10px;text-align:center;color:#ffd700;font-weight:800;font-size:11px;box-shadow:0 0 15px #ffd70044;margin-bottom:14px}
.hero{text-align:center;padding:12px 0}
.hero h1{font-family:Orbitron;font-size:30px;background:linear-gradient(90deg,#c9a86a,#ffd700,#c9a86a);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 10px #ffd70088)}
.hero p{font-size:11px;letter-spacing:4px;color:#c9a86a;margin-top:4px}
.desc{border:1.5px solid #3a2e14;background:#111;border-radius:16px;padding:12px;text-align:center;font-size:11px;line-height:1.6;color:#ddd}
.badge-row{display:flex;gap:8px;justify-content:center;margin-top:8px}
.badge{padding:6px 12px;border-radius:999px;font-size:9px;font-weight:800;border:1px solid}
.country{display:flex;gap:10px;justify-content:center;margin:14px 0}
.cbtn{padding:8px 18px;border-radius:999px;border:1px solid #333;background:#111;color:#fff;font-weight:700;font-size:12px;cursor:pointer}
.cbtn.active{background:#fff;color:#000}
.prod-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
.card{border:1.5px solid #3a2e14;background:linear-gradient(180deg,#1a160a,#0f0d05);border-radius:16px;overflow:hidden;position:relative;box-shadow:0 0 15px rgba(255,215,0,.12)}
.card:before{content:'';position:absolute;top:0;left:0;width:100%;height:2px;background:linear-gradient(90deg,transparent,#ffd700,transparent)}
.card img{width:100%;height:140px;object-fit:cover;background:#000;display:block}
.card-info{padding:9px}
.card-title{font-size:10.5px;font-weight:700;min-height:32px;line-height:1.3}
.card-price{color:#ffd700;font-weight:800;font-size:13.5px;margin:5px 0}
.btn-buy{width:100%;padding:8px;border:none;border-radius:9px;background:linear-gradient(90deg,#c9a86a,#ffd700);color:#000;font-weight:900;font-size:10.5px;cursor:pointer}
.cat{grid-column:1/-1;background:linear-gradient(90deg,#1a160a,#2a2300);border:1px solid #ffd70044;border-radius:10px;padding:8px;text-align:center;color:#ffd700;font-weight:800;font-size:12px;letter-spacing:2px;margin-top:6px}
</style>
</head>
<body>
<canvas id="bgCanvas"></canvas><div class="overlay"></div>
<div class="wrap">
<div class="mp3bar">🔊 MP3 "DAP-ORDER-GOLD-EDITION.mp3" PLAYING 🟢 - GOLD EDITION</div>
<div class="hero"><h1>DAP ORDER APK</h1><p>OFFICIAL SHOP • GOLD EDITION</p></div>
<div class="desc">HAI PENGGUNA WEBSITE!, INI ADALAH WEBSITE JUAL BELI APLIKASI BUG WHATSAPP GACOR, SILAHKAN PILIH APLIKASI BUG YANG ANDA SUKA, SEMOGA PUAS DAN BERLANGGANAN!!<div class="badge-row"><div class="badge" style="border-color:#00ff88;color:#00ff88">STABIL</div><div class="badge" style="border-color:#00c8ff;color:#00c8ff">OTOMATIS</div><div class="badge" style="border-color:#ffd700;color:#ffd700">AMAN</div></div></div>
<div class="country"><button class="cbtn active" id="btnID" onclick="setCountry('ID')">🇮🇩 ID Rp</button><button class="cbtn" id="btnMY" onclick="setCountry('MY')">🇲🇾 MY RM</button></div>
<div class="prod-grid" id="prodGrid"></div>
<div style="text-align:center;margin-top:18px;padding:12px;border:1px solid #222;border-radius:12px;background:#0a0a0a"><div style="color:#ffd700;font-weight:800" id="totalEl">Total: Rp 0</div><button onclick="checkout()" style="margin-top:10px;width:100%;padding:12px;background:linear-gradient(90deg,#ffd700,#c9a86a);border:none;border-radius:10px;font-weight:800;color:#000">CHECKOUT → PAYMENT</button><div id="dashboard"></div></div>
</div>
<script>
const canvas=document.getElementById('bgCanvas');const ctx=canvas.getContext('2d');let w,h,particles=[];function resize(){w=canvas.width=window.innerWidth;h=canvas.height=window.innerHeight}window.addEventListener('resize',resize);resize();for(let i=0;i<70;i++){particles.push({x:Math.random()*w,y:Math.random()*h,r:Math.random()*2+1,c:`hsl(${Math.random()*60+35},100%,50%)`,vx:(Math.random()-0.5)*0.5,vy:(Math.random()-0.5)*0.5})}function anim(){ctx.clearRect(0,0,w,h);particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>w)p.vx*=-1;if(p.y<0||p.y>h)p.vy*=-1;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=p.c;ctx.shadowBlur=10;ctx.shadowColor=p.c;ctx.fill();});requestAnimationFrame(anim)}anim();

let country=localStorage.getItem('country')||'ID';const RATE=3600;
// DATABASE FINAL - SEMUA FOTO .JPG
let produk=[
{c:"DarkVerse",n:"DarkVerse - FULL UPDATE",h:50000,i:"darkverse.jpg"},
{c:"DarkVerse",n:"DarkVerse - RESELLER",h:80000,i:"darkverse.jpg"},
{c:"DarkVerse",n:"DarkVerse - PARTNER",h:150000,i:"darkverse.jpg"},
{c:"X-GTR4SH",n:"X-GTR4SH - FULL UPDATE",h:20000,i:"xgtr4sh.jpg"},
{c:"X-GTR4SH",n:"X-GTR4SH - RESELLER",h:30000,i:"xgtr4sh.jpg"},
{c:"X-GTR4SH",n:"X-GTR4SH - ADMIN",h:50000,i:"xgtr4sh.jpg"},
{c:"X-GTR4SH",n:"X-GTR4SH - PARTNER",h:70000,i:"xgtr4sh.jpg"},
{c:"X-GTR4SH",n:"X-GTR4SH - MODERATOR",h:100000,i:"xgtr4sh.jpg"},
{c:"TRAPENDEN",n:"APK TRAPENDEN - FULL UPDATE",h:25000,i:"trapenden.jpg"},
{c:"TRAPENDEN",n:"APK TRAPENDEN - RESELLER",h:45000,i:"trapenden.jpg"},
{c:"TRAPENDEN",n:"APK TRAPENDEN - ADMIN",h:55000,i:"trapenden.jpg"},
{c:"TRAPENDEN",n:"APK TRAPENDEN - VIP",h:60000,i:"trapenden.jpg"},
{c:"TRAPENDEN",n:"APK TRAPENDEN - PT",h:80000,i:"trapenden.jpg"},
{c:"TRAPENDEN",n:"APK TRAPENDEN - MODERATOR",h:100000,i:"trapenden.jpg"},
];
let cart=JSON.parse(localStorage.getItem('dap_cart_detail')||'[]');let total=parseInt(localStorage.getItem('dap_total')||'0');
function fmt(n){return country==='MY'?'RM '+(n/RATE).toFixed(2):'Rp '+n.toLocaleString('id-ID');}
function setCountry(c){country=c;localStorage.setItem('country',c);document.getElementById('btnID').classList.toggle('active',c==='ID');document.getElementById('btnMY').classList.toggle('active',c==='MY');render();}
function render(){
let grid=document.getElementById('prodGrid');let html='';let lastCat='';
produk.forEach((p,idx)=>{
if(p.c!==lastCat){html+=`<div class="cat">🔥 ${p.c} 🔥</div>`;lastCat=p.c;}
let jpgUrl = p.i; // FILE JPG ASLI
// FALLBACK JPG PLACEHOLDER KALO FILE BELUM ADA DI GITHUB
let fallback = `https://via.placeholder.com/400x300.jpg?text=${encodeURIComponent(p.n)}`;
html+=`<div class="card"><img src="${jpgUrl}" onerror="this.src='${fallback}'" alt="${p.n}"><div class="card-info"><div class="card-title">${p.n}</div><div class="card-price">${fmt(p.h)}</div><button class="btn-buy" onclick="tambah(${idx})">BELI / BUY</button></div></div>`;
});
grid.innerHTML=html;document.getElementById('totalEl').innerText='Total: '+fmt(total);renderBukti();
}
function tambah(i){let p=produk[i];cart.push({nama:p.n,harga:p.h});total+=p.h;localStorage.setItem('dap_cart_detail',JSON.stringify(cart));localStorage.setItem('dap_total',total);render();if(navigator.vibrate)navigator.vibrate(50);}
function checkout(){if(total===0)return alert('Keranjang kosong wok!');location.href='payment.html';}
function renderBukti(){let list=JSON.parse(localStorage.getItem('dap_bukti')||'[]');let html=list.length?'<h4 style="color:#ffd700;font-size:11px;text-align:center;margin:12px 0">📋 TESTIMONI PEMBELI</h4>':'';list.slice(0,5).forEach(b=>{html+=`<div style="background:#1a160a;border:1px solid #2a2310;border-radius:10px;padding:8px;margin:6px 0"><div style="font-size:10px;opacity:.7">${b.time} - ${b.method}</div><img src="${b.img}" style="width:100%;border-radius:8px;margin-top:6px"></div>`});document.getElementById('dashboard').innerHTML=html;}
render();setCountry(country);
</script>
</body>
</html>
