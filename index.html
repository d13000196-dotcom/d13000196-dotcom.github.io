<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>DAP ORDER APK - OFFICIAL SHOP</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{background:#07070b;color:#fff;font-family:Poppins,sans-serif;overflow-x:hidden}video::-webkit-media-controls{display:none!important}.top{text-align:center;padding:18px 14px 10px;padding-top:calc(18px + env(safe-area-inset-top))}.top h1{font-size:1.9rem;letter-spacing:2.5px;font-weight:800}.top p{opacity:.5;font-size:.78rem;letter-spacing:3px;margin-top:4px}.desc-box{max-width:700px;margin:12px auto 0;background:rgba(255,255,255,0.05);border:1px solid #ffffff14;border-radius:14px;padding:12px 14px;text-align:center}.desc-text{font-size:.78rem;line-height:1.5;opacity:.85}.tags{margin-top:8px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.tag{padding:4px 10px;border-radius:999px;font-size:.68rem;font-weight:700}.tag-green{background:#00ff8815;border:1px solid #00ff8844;color:#00ff88}.tag-blue{background:#00c6ff15;border:1px solid #00c6ff44;color:#00c6ff}.tag-yellow{background:#ffe60015;border:1px solid #ffe60044;color:#ffe600}.country{display:flex;justify-content:center;gap:8px;margin:12px auto}.country button{padding:6px 14px;border-radius:999px;border:1px solid #333;background:#1a1a26;color:#fff;font-weight:700;font-size:.78rem;cursor:pointer}.country button.active{background:#fff;color:#000;border-color:#fff}.video-layers-wrap{width:95%;max-width:1100px;margin:10px auto 20px;border-radius:22px;overflow:hidden;height:380px;background:#000;position:relative;border:1px solid #ff004033}.video-layers-wrap video{width:100%;height:100%;object-fit:cover;display:block}.video-fallback{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}.btn-video-active{position:absolute;right:14px;bottom:14px;background:#ff0a32;color:#fff;padding:7px 14px;border-radius:999px;font-size:.7rem;font-weight:800;z-index:2}.sound-on{position:absolute;left:14px;bottom:14px;background:#00ff8855;border:1px solid #00ff88;color:#fff;padding:7px 12px;border-radius:999px;font-size:.68rem;z-index:2}.products{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:12px}@media(min-width:700px){.products{grid-template-columns:repeat(3,1fr)}}.card{background:#12121a;border:1px solid #1e1e2a;border-radius:16px;padding:10px}.card img{width:100%;height:145px;object-fit:cover;border-radius:12px;background:#0e0e14;display:block}.card-title{font-weight:700;margin-top:8px;font-size:.84rem}.price{font-weight:800;color:#00ff88;margin:6px 0;font-size:.88rem}.price small{color:#888;font-weight:400;font-size:.68rem;display:block}.up-tab{border:1px dashed #ffe600;background:rgba(255,230,0,.08);border-radius:10px;padding:8px;margin-top:8px;font-size:.68rem}.up-tab.locked{opacity:.65}.up-tab.up-head{color:#ffe600;font-weight:800;margin-bottom:3px}.up-tab button{width:100%;margin-top:6px;padding:8px;border:none;border-radius:8px;font-weight:800;cursor:pointer;background:#ffe600;color:#000}.up-tab.locked button{background:#333;color:#777}.btn{width:100%;padding:10px;border:none;border-radius:10px;font-weight:800;cursor:pointer;font-size:.84rem}.btn-r{background:#ff0a32;color:#fff}.btn-b{background:#0a84ff;color:#fff}
#floatCart{position:fixed;right:18px;bottom:calc(22px + env(safe-area-inset-bottom));width:60px;height:60px;background:linear-gradient(135deg,#00c6ff,#7a00ff);border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:9999;cursor:grab;touch-action:none;box-shadow:0 8px 24px #7a00ff55}
#cart{position:fixed;right:-400px;top:0;width:380px;max-width:92vw;height:100dvh;background:#0f0f17;border-left:1px solid #222;transition:.35s;z-index:9998;padding:16px;display:flex;flex-direction:column}#cart.open{right:0}#cartOverlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:9997}#cartOverlay.show{display:block}
.c-item{background:#1a1a26;margin:8px 0;padding:12px;border-radius:12px}.c-top{display:flex;justify-content:space-between;gap:8px;font-size:.84rem;font-weight:600}.c-ctrl{display:flex;align-items:center;justify-content:space-between;margin-top:10px}.qty{display:flex;align-items:center;gap:10px;background:#0e0e14;padding:4px 10px;border-radius:999px;border:1px solid #222}.qty button{width:28px;height:28px;border-radius:50%;border:none;background:#222;color:#fff;font-weight:800;cursor:pointer}
</style></head><body>
<div class="top"><h1>DAP ORDER APK</h1><p>OFFICIAL SHOP</p>
<div class="desc-box"><div class="desc-text">HAI, PENGGUNAAN WEBSITE!, INI WEBSITE JUAL BELI APLIKASI BUG WHATSAPP, DISINI MENJUAL BEBERAPA APLIKASI BUG WHATSAPP GACOR DAN TERPERCAYA. SILAHKAN PILIH APLIKASI YANG INGIN KAU BELI SELAMAT MENIKMATI..!!</div><div class="tags"><span class="tag tag-green">STABIL</span><span class="tag tag-blue">OTOMATIS</span><span class="tag tag-yellow">AMAN</span></div></div>
<div class="country"><button id="btnID" class="active" onclick="setCountry('ID')">🇮🇩 ID - Rp</button><button id="btnMY" onclick="setCountry('MY')">🇲🇾 MY - RM</button></div>
</div>
<div class="video-layers-wrap" id="videoWrap">
<video id="layersVideo" autoplay loop muted playsinline webkit-playsinline x5-playsinline preload="auto" poster="darkverse.jpg"></video>
<img id="videoFallback" class="video-fallback" src="darkverse.jpg" alt="fallback">
<button class="btn-video-active">VIDEO ACTIVE</button><div class="sound-on">🔊 SOUND ON 120FPS HD+</div></div>
<audio id="bgAudio" autoplay loop preload="auto"></audio>
<div class="products" id="prod"></div>
<div id="cartOverlay" onclick="closeCart()"></div>
<div id="floatCart">🛒<span id="cc" style="position:absolute;top:-4px;right:-4px;background:#ff0a32;width:20px;height:20px;border-radius:50%;font-size:.68rem;display:flex;align-items:center;justify-content:center;font-weight:800">0</span></div>
<div id="cart"><div style="display:flex;justify-content:space-between;align-items:center"><h3>Keranjang</h3><div style="display:flex;gap:10px;align-items:center"><button onclick="clearCart()" style="background:#ff0a32;border:none;color:#fff;padding:6px 10px;border-radius:8px;font-size:.7rem;font-weight:700;cursor:pointer">KOSONGKAN</button><span onclick="closeCart()" style="cursor:pointer;opacity:.6;font-size:1.2rem">✕</span></div></div><div id="citems" style="flex:1;overflow:auto;margin:12px 0"></div><div id="ctotal" style="font-weight:800;font-size:1.05rem;text-align:center;margin:6px 0"></div><div id="ctotalMY" style="opacity:.6;font-size:.8rem;text-align:center"></div><button class="btn btn-r" style="margin-top:12px" onclick="goPay()">LANJUT KE PAYMENT →</button><button class="btn" style="background:#1e1e2e;margin-top:8px" onclick="closeCart()">Tutup</button></div>
<script>
const v=document.getElementById('layersVideo'); const fb=document.getElementById('videoFallback');
const sources=["darkverse-layers.mp4","Darkverse-layers.mp4","darkverse-layers.MP4","darkverse_layers.mp4","video.mp4","layers.mp4"];
const audioSources=["darkverse-layers.mp3","darkverse-layers.MP3","audio.mp3"];
let si=0, ai=0;
function tryVideo(){
 if(si>=sources.length){ fb.style.display='block'; return; }
 v.src=sources[si]; v.load(); v.play().then(()=>{ fb.style.display='none'; }).catch(()=>{ si++; tryVideo(); });
}
function tryAudio(){
 if(ai>=audioSources.length) return;
 let a=document.getElementById('bgAudio'); a.src=audioSources[ai];
 a.play().then(()=>{}).catch(()=>{ ai++; tryAudio(); });
}
v.addEventListener('error', ()=>{ si++; tryVideo(); });
tryVideo(); tryAudio();
function forceSound(){ v.muted=false; v.volume=0.7; let a=document.getElementById('bgAudio'); if(a){ a.muted=false; a.volume=0.5; a.play().catch(()=>{});} v.play().catch(()=>{}); fb.style.display='none'; }
window.addEventListener('load', ()=>{ forceSound(); setTimeout(forceSound,300); setTimeout(forceSound,1000); });
['click','touchstart'].forEach(ev=>{ document.addEventListener(ev, ()=>forceSound(), {once:true}); });
let country=localStorage.getItem('country')||'ID';
const RATE=3600;
function setCountry(c){ country=c; localStorage.setItem('country',c); document.getElementById('btnID').classList.toggle('active',c==='ID'); document.getElementById('btnMY').classList.toggle('active',c==='MY'); render(); upd(); }
function fmtIDR(n){ return 'Rp '+n.toLocaleString('id-ID'); }
function fmtMYR(n){ return 'RM '+(n/RATE).toFixed(2); }
function priceDisplay(n){ if(country==='MY'){ return fmtMYR(n)+`<small>${fmtIDR(n)}</small>`; } else { return fmtIDR(n)+`<small>${fmtMYR(n)}</small>`; } }
const DATA=[
{app:'darkverse',name:'DarkVerse',imgs:['darkverse.jpg','DarkVerse.jpg','DARKVERSE.jpg','darkverse.png'],tiers:[{id:'dv-full',label:'FULL UPDATE',price:50000},{id:'dv-reseller',label:'RESELLER',price:80000},{id:'dv-partner',label:'PARTNER',price:150000}]},
{app:'tr4svloid',name:'TR4SVLOID',imgs:['tr4svloid.jpg','TR4SVLOID.jpg','tr4svoid.jpg','TR4SVOID.jpg','tr4svloid.png','Tr4sVloid.jpg'],tiers:[{id:'tr-1mgg',label:'1 MINGGU',price:10000},{id:'tr-1bln',label:'1 BULAN',price:15000},{id:'tr-full',label:'FULL UPDATE',price:25000},{id:'tr-reseller',label:'RESELLER',price:55000},{id:'tr-vip1bln',label:'VIP 1 BULAN',price:30000},{id:'tr-vipperm',label:'VIP PERMANEN',price:50000},{id:'tr-partner',label:'PARTNER',price:65000}]},
{app:'xgtr4sh',name:'X-GTR4SH',imgs:['x-gtr4sh.jpg','X-GTR4SH.jpg','xgtr4sh.jpg','XGTR4SH.jpg','xgtrash.jpg','X-GTR4SH.png','x-gtr4sh.png'],tiers:[{id:'xg-full',label:'FULL UPDATE',price:20000},{id:'xg-reseller',label:'RESELLER',price:30000},{id:'xg-admin',label:'ADMIN',price:50000},{id:'xg-partner',label:'PARTNER',price:70000},{id:'xg-mod',label:'MODERATOR',price:100000}]},
{app:'orca',name:'ORCA MALIGNANT',imgs:['orca.jpg','ORCA.jpg','orca.png','Orca.jpg','orca-malignant.jpg'],tiers:[{id:'orca-full',label:'FULL UPDATE',price:30000},{id:'orca-reseller',label:'RESELLER',price:45000},{id:'orca-admin',label:'ADMIN',price:55000},{id:'orca-vip',label:'VIP',price:75000},{id:'orca-partner',label:'PARTNER',price:60000},{id:'orca-mod',label:'MODERATOR',price:75000},{id:'orca-owner',label:'OWNER',price:100000},{id:'orca-ownervip',label:'OWNER VIP',price:120000}]}
];
let owned=JSON.parse(localStorage.getItem('owned')||'[]');
let cart=JSON.parse(localStorage.getItem('cart')||'[]');
function getOwnedForApp(app){let d=DATA.find(x=>x.app===app);if(!d)return null;let b=null;d.tiers.forEach(t=>{if(owned.includes(t.id)){if(!b||t.price>b.price)b=t}});return b;}
function imgOnError(el, app){
 let idx=parseInt(el.dataset.idx||'0');
 idx++;
 if(idx < app.imgs.length){ el.dataset.idx=idx; el.src=app.imgs[idx]; }
 else { el.src='darkverse.jpg'; }
}
function render(){let h='';DATA.forEach(app=>{const ot=getOwnedForApp(app.app);app.tiers.forEach(t=>{let up=null,can=false,txt='';if(ot&&t.price>ot.price){up=t.price-ot.price;can=true;txt=`Up ${ot.label} → ${t.label} ${fmtIDR(up)}`;}else if(!ot){let low=app.tiers.filter(x=>x.price<t.price).sort((a,b)=>b.price-a.price)[0];if(low){up=t.price-low.price;txt=`Up ${low.label} → ${t.label} ${fmtIDR(up)}`;}else txt=`Beli ${t.label} unlock Up Role`;}else txt=`Punya ${ot.label}`;const lock=!can;let firstImg=app.imgs[0];h+=`<div class="card"><img src="${firstImg}" data-idx="0" onerror="imgOnError(this, {imgs: ${JSON.stringify(app.imgs).replace(/"/g,'&quot;')}})" onload="this.style.display='block'"><div class="card-title">${app.name} - ${t.label}</div><div class="price">${priceDisplay(t.price)}</div><button class="btn ${t.label.includes('RESELLER')||t.label.includes('PARTNER')?'btn-b':'btn-r'}" onclick="add('${t.id}',${t.price},'${app.name} ${t.label}')">BELI</button><div class="up-tab ${lock?'locked':''}"><div class="up-head">🔒 TAB UP ROLE (LOCK)</div><div>${txt}</div><button ${lock?'disabled':''} onclick="${can?`add('${t.id}',${up},'UP ROLE')`:''}">${can?`UP ROLE ${fmtIDR(up)}`:'LOCKED'}</button></div></div>`;});});document.getElementById('prod').innerHTML=h;document.getElementById('btnID').classList.toggle('active',country==='ID');document.getElementById('btnMY').classList.toggle('active',country==='MY');}
function add(id,price,name){let f=cart.find(c=>c.id===id);if(f){f.qty+=1;}else{cart.push({id,price,name,qty:1});}save();}
function save(){localStorage.setItem('cart',JSON.stringify(cart));upd();openCart();}
function upd(){let tot=0,qty=0,h='';cart.forEach((c,i)=>{tot+=c.price*c.qty;qty+=c.qty;h+=`<div class="c-item"><div class="c-top"><span>${c.name}</span><span>${country==='ID'?fmtIDR(c.price*c.qty):fmtMYR(c.price*c.qty)}</span></div><div class="c-ctrl"><div class="qty"><button onclick="dec(${i})">-</button><span>${c.qty}</span><button onclick="inc(${i})">+</button></div><button onclick="rem(${i})" style="background:transparent;border:1px solid #ff0a3233;color:#ff0a32;padding:6px 10px;border-radius:8px;font-size:.7rem;cursor:pointer">HAPUS</button></div></div>`;});document.getElementById('citems').innerHTML=h||'<div style="opacity:.5;text-align:center;padding:30px">Kosong</div>';if(country==='ID'){document.getElementById('ctotal').innerText='Total: '+fmtIDR(tot);document.getElementById('ctotalMY').innerText=fmtMYR(tot)+' (MY)';}else{document.getElementById('ctotal').innerText='Total: '+fmtMYR(tot);document.getElementById('ctotalMY').innerText=fmtIDR(tot)+' (ID)';}document.getElementById('cc').innerText=qty;}
function inc(i){cart[i].qty++;save2();}function dec(i){if(cart[i].qty>1){cart[i].qty--;}else{cart.splice(i,1);}save2();}function rem(i){cart.splice(i,1);save2();}function save2(){localStorage.setItem('cart',JSON.stringify(cart));upd();}
function clearCart(){if(confirm('Kosongkan?')){cart=[];localStorage.setItem('cart','[]');upd();}}
function openCart(){document.getElementById('cart').classList.add('open');document.getElementById('cartOverlay').classList.add('show');}
function closeCart(){document.getElementById('cart').classList.remove('open');document.getElementById('cartOverlay').classList.remove('show');}
function goPay(){if(cart.length===0)return alert('kosong');localStorage.setItem('country',country);location.href='payment.html?v='+Date.now();}
const fc=document.getElementById('floatCart');let isDrag=false,sx,sy,ol,ot,moved=false;function gp(e){return e.touches?e.touches[0]:e;}function ds(e){isDrag=true;moved=false;let p=gp(e);sx=p.clientX;sy=p.clientY;let r=fc.getBoundingClientRect();ol=r.left;ot=r.top;fc.style.transition='none';}function dm(e){if(!isDrag)return;let p=gp(e);let dx=p.clientX-sx,dy=p.clientY-sy;if(Math.abs(dx)>5||Math.abs(dy)>5)moved=true;let nl=ol+dx,nt=ot+dy;nl=Math.max(8,Math.min(window.innerWidth-fc.offsetWidth-8,nl));nt=Math.max(8,Math.min(window.innerHeight-fc.offsetHeight-8,nt));fc.style.left=nl+'px';fc.style.top=nt+'px';fc.style.right='auto';fc.style.bottom='auto';e.preventDefault();}function de(){isDrag=false;fc.style.transition='';setTimeout(()=>moved=false,100);}fc.addEventListener('mousedown',ds);fc.addEventListener('touchstart',ds,{passive:false});window.addEventListener('mousemove',dm,{passive:false});window.addEventListener('touchmove',dm,{passive:false});window.addEventListener('mouseup',de);window.addEventListener('touchend',de);fc.addEventListener('click',()=>{if(!moved)openCart();});
render();upd();
</script></body></html>
