<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DAP ORDER APK - OFFICIAL SHOP</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0a0a0a;color:#fff}
.layers{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;opacity:.12;background:linear-gradient(45deg,#111 25%,transparent 25%,transparent 75%,#111 75%),linear-gradient(-45deg,#111 25%,transparent 25%,transparent 75%,#111 75%);background-size:40px 40px}
.header{text-align:center;padding:25px;background:rgba(0,0,0,.9);border-bottom:2px solid #00ff88}
.header h1{color:#00ff88;letter-spacing:2px;font-size:19px}
.header p{color:#aaa;font-size:12px;margin-top:6px}
.container{max-width:1000px;margin:20px auto;padding:0 15px;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.card{background:#161616;border:1px solid #222;border-radius:12px;overflow:hidden}
.card img{width:100%;height:200px;object-fit:cover;background:#111}
.card-body{padding:15px}
.card-body h3{color:#00ff88;margin-bottom:10px}
.varian{margin:8px 0;background:#1f1f1f;padding:10px;border-radius:8px;display:flex;justify-content:space-between;align-items:center}
.varian button{background:#00ff88;border:none;padding:6px 14px;border-radius:6px;font-weight:bold;cursor:pointer}
.cart{max-width:500px;margin:20px auto;background:#161616;border:1px solid #222;border-radius:12px;padding:15px;text-align:center}
.btn-pay{width:100%;padding:13px;background:#00ff88;border:none;border-radius:8px;font-weight:bold;margin-top:10px;cursor:pointer}
.bukti-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px;margin-top:10px}
.bukti-list img{width:100%;border-radius:6px;border:1px solid #333}
</style>
</head>
<body>
<div class="layers"></div>
<div class="header">
<h1>DAP ORDER APK - OFFICIAL SHOP</h1>
<p>Website Resmi Penyedia Aplikasi Bug WhatsApp Terpercaya - Aman, Cepat & Bergaransi, Dan Juga Langsung Di Arahkan Sama Owner Website</p>
</div>
<div class="container" id="produk-list"></div>
<div class="cart">
<h3>KERANJANG</h3>
<div id="cart-list" style="margin:10px 0;color:#aaa;font-size:14px">Belum ada item</div>
<div id="total" style="font-size:20px;color:#00ff88;font-weight:bold">Total: Rp 0</div>
<button class="btn-pay" onclick="kePayment()">LANJUT KE PAYMENT</button>
<h4 style="margin-top:20px">DASHBOARD BUKTI TF</h4>
<div class="bukti-list" id="bukti-list"></div>
</div>
<script>
// === EDIT NAMA & FOTO GAMPANG DISINI WOK ===
const produk = [
{
nama:"DarkVerse", // GANTI NAMA APK 1 DISINI
foto:"darkverse.jpg",
varian:[
{nama:"FULL UPDATE",harga:50000},
{nama:"RESELLER",harga:80000},
{nama:"PARTNER",harga:150000}
]
},
{
nama:"X-GTR4SH", // GANTI NAMA APK 2 DISINI
foto:"xgtr4sh.jpg",
varian:[
{nama:"FULL UPDATE",harga:20000},
{nama:"RESELLER",harga:30000},
{nama:"ADMIN",harga:50000},
{nama:"PARTNER",harga:70000},
{nama:"MODERATOR",harga:100000}
]
}
];
// ============================================
let cart=[],total=0;
let listEl=document.getElementById('produk-list');
produk.forEach((p,i)=>{
let vHTML=p.varian.map((v,j)=>`<div class="varian"><span>${v.nama} - Rp ${v.harga.toLocaleString()}</span><button onclick="tambah(${i},${j})">+</button></div>`).join('');
let d=document.createElement('div');d.className='card';
d.innerHTML=`<img src="${p.foto}" onerror="this.src='https://via.placeholder.com/400x300/111/00ff88?text=${encodeURIComponent(p.nama)}'"><div class="card-body"><h3>${p.nama}</h3>${vHTML}</div>`;
listEl.appendChild(d);
});
function tambah(pi,vi){let it=produk[pi].varian[vi];cart.push({nama:`${produk[pi].nama} - ${it.nama}`,harga:it.harga});total+=it.harga;render();}
function render(){document.getElementById('cart-list').innerHTML=cart.length?cart.map(c=>`${c.nama} - Rp ${c.harga.toLocaleString()}`).join('<br>'):'Belum ada item';document.getElementById('total').innerText='Total: Rp '+total.toLocaleString();localStorage.setItem('dap_total',total);}
function kePayment(){if(total==0){alert('Keranjang kosong');return}location.href='payment.html';}
function loadBukti(){let list=JSON.parse(localStorage.getItem('dap_bukti')||'[]');document.getElementById('bukti-list').innerHTML=list.map(b=>`<img src="${b.img}">`).join('')||'<p style="color:#555;font-size:12px">Belum ada bukti</p>';}
loadBukti();setInterval(loadBukti,2000);
</script>
</body>
</html>
