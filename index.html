<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DapOrderApk Official</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#f6f6f7;font-family:'Inter',sans-serif}
.header{background:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;border-bottom:1px solid #eee}
.logo{font-weight:800;font-size:18px} .logo span{color:#00bfa6}
.badge{background:#111;color:#fff;padding:6px 12px;border-radius:100px;font-size:12px;font-weight:800;cursor:pointer}
.banner{margin:14px;background:#111;color:#fff;border-radius:18px;padding:18px;text-align:center}
.banner h1{font-size:22px} .banner h1 span{color:#00ffcc}
.trust{display:flex;justify-content:center;gap:6px;margin-top:10px;flex-wrap:wrap}
.trust span{background:#222;border:1px solid #333;padding:5px 10px;border-radius:100px;font-size:10px}
.search{margin:14px;display:flex;gap:8px} .search input{flex:1;padding:12px;border-radius:12px;border:1px solid #ddd;outline:none}
.cats{display:flex;gap:8px;overflow-x:auto;padding:0 14px 10px} .cats button{border:1px solid #ddd;background:#fff;border-radius:100px;padding:8px 14px;font-size:12px;font-weight:700;white-space:nowrap;cursor:pointer} .cats button.active{background:#111;color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:0 14px}
.card{background:#fff;border:1px solid #eee;border-radius:16px;overflow:hidden}
.card img{width:100%;height:120px;object-fit:cover;background:#111}
.card-body{padding:10px} .card h3{font-size:11px;min-height:30px}
.price{color:#00bfa6;font-weight:800;font-size:12px;margin-top:4px}
.add{width:100%;margin-top:8px;background:#111;color:#fff;border:none;padding:9px;border-radius:10px;font-weight:800;font-size:11px;cursor:pointer}
#cartModal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:20;padding:20px}
.cartBox{background:#fff;border-radius:20px;max-width:380px;margin:8% auto;padding:18px}
.q-btn{width:28px;height:28px;border-radius:8px;border:1px solid #ddd;background:#fff;font-weight:800;cursor:pointer}
.footer{text-align:center;padding:18px;font-size:10px;opacity:.5}
</style>
</head>
<body>
<div class="header"><div class="logo">DapOrder<span>Apk</span></div><div class="badge" onclick="openCart()">🛒 <span id="cartCount">0</span></div></div>
<div class="banner"><h1>DapOrderApk <span>OFFICIAL</span></h1><p style="font-size:12px;margin-top:4px">🔥 TRUSTED 1000+ CUSTOMER • PROSES 5 MENIT</p><div class="trust"><span>✅ 1000+ Terjual</span><span>⭐ 4.9 Rating</span><span>⚡ Instant</span></div></div>
<div class="search"><input id="search" placeholder="Cari DarkVerse, TR4SVLOID..." oninput="render()"></div>
<div class="cats"><button class="active" onclick="setCat('all',this)">Semua</button><button onclick="setCat('DarkVerse',this)">DarkVerse</button><button onclick="setCat('TR4SVLOID',this)">TR4SVLOID</button><button onclick="setCat('X-GTR4SH',this)">X-GTR4SH</button></div>
<div class="grid" id="grid"></div>
<div class="footer">DANA: 082312728245 • WA: 083879195047 • IG: @daporderapk</div>
<div id="cartModal"><div class="cartBox"><h3 style="font-weight:800">Keranjang</h3><div id="cartList" style="margin:12px 0"></div><div id="cartTotal" style="font-weight:800;color:#00bfa6"></div><a href="payment.html" id="payBtn" style="display:block;background:#111;color:#fff;text-align:center;padding:12px;border-radius:12px;margin-top:12px;text-decoration:none;font-weight:800">LANJUT BAYAR →</a><div style="text-align:center;margin-top:12px;font-size:12px;opacity:.6;cursor:pointer" onclick="closeCart()">Tutup</div></div></div>
<script>
let defaults=[{id:1,name:'DarkVerse FULL UPDATE',price:50000,cat:'DarkVerse'},{id:2,name:'DarkVerse RESELLER',price:80000,cat:'DarkVerse'},{id:3,name:'DarkVerse PARTNER',price:150000,cat:'DarkVerse'},{id:4,name:'TR4SVLOID 1 MINGGU',price:10000,cat:'TR4SVLOID'},{id:5,name:'TR4SVLOID 1 BULAN',price:15000,cat:'TR4SVLOID'},{id:6,name:'TR4SVLOID FULL UPDATE',price:25000,cat:'TR4SVLOID'},{id:7,name:'TR4SVLOID RESELLER',price:55000,cat:'TR4SVLOID'},{id:8,name:'TR4SVLOID VIP 1 BULAN',price:30000,cat:'TR4SVLOID'},{id:9,name:'TR4SVLOID VIP PERMANEN',price:50000,cat:'TR4SVLOID'},{id:10,name:'TR4SVLOID PARTNER',price:65000,cat:'TR4SVLOID'},{id:11,name:'X-GTR4SH FULL UPDATE',price:20000,cat:'X-GTR4SH'},{id:12,name:'X-GTR4SH RESELLER',price:30000,cat:'X-GTR4SH'},{id:13,name:'X-GTR4SH ADMIN',price:50000,cat:'X-GTR4SH'},{id:14,name:'X-GTR4SH PARTNER',price:70000,cat:'X-GTR4SH'},{id:15,name:'X-GTR4SH MODERATOR',price:100000,cat:'X-GTR4SH'}];
let custom=JSON.parse(localStorage.getItem('daporder_custom')||'[]');
let products=[...defaults,...custom];
let cart=JSON.parse(localStorage.getItem('daporderapk_final')||'[]');
let cur='all';
function imgFor(n){return `https://via.placeholder.com/300x200/111111/00FFCC?text=${encodeURIComponent(n.substring(0,12))}`;}
function save(){localStorage.setItem('daporderapk_final',JSON.stringify(cart)); render();}
function setCat(c,el){cur=c; document.querySelectorAll('.cats button').forEach(b=>b.classList.remove('active')); el.classList.add('active'); render();}
function render(){
 let s=document.getElementById('search').value.toLowerCase();
 let f=products.filter(p=>{let okCat=cur==='all'||p.name.toUpperCase().includes(cur.toUpperCase()); return okCat&&p.name.toLowerCase().includes(s);});
 document.getElementById('grid').innerHTML=f.map(p=>`<div class="card"><img src="${p.img||imgFor(p.name)}" onerror="this.src='${imgFor(p.name)}'"><div class="card-body"><h3>${p.name}</h3><div class="price">Rp ${p.price.toLocaleString('id-ID')}</div><button class="add" onclick="addCart(${p.id})">+ KERANJANG</button></div></div>`).join('');
 document.getElementById('cartCount').innerText=cart.reduce((a,b)=>a+b.qty,0);
 if(document.getElementById('cartModal').style.display==='block') openCart();
}
function addCart(id){let e=cart.find(x=>x.id===id); if(e) e.qty++; else cart.push({id,qty:1}); save(); openCart();}
function inc(id){let e=cart.find(x=>x.id===id); if(e){e.qty++; save(); openCart();}}
function dec(id){let e=cart.find(x=>x.id===id); if(e){e.qty--; if(e.qty<=0) cart=cart.filter(x=>x.id!==id); save(); openCart();}}
function removeItem(id){cart=cart.filter(x=>x.id!==id); save(); openCart();}
function openCart(){
 let h='',tot=0;
 cart.forEach(c=>{
  let p=products.find(x=>x.id===c.id); if(!p) return;
  let sub=p.price*c.qty; tot+=sub;
  h+=`<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f0f0f0"><div><div style="font-size:13px;font-weight:700">${p.name}</div><div style="font-size:12px;color:#00bfa6">Rp ${sub.toLocaleString('id-ID')}</div><div style="display:flex;gap:8px;align-items:center;margin-top:6px"><button class="q-btn" onclick="dec(${c.id})">-</button><b>${c.qty}</b><button class="q-btn" onclick="inc(${c.id})">+</button><span style="color:#ff3b30;font-size:11px;font-weight:800;cursor:pointer;margin-left:6px" onclick="removeItem(${c.id})">HAPUS</span></div></div></div>`;
 });
 if(!cart.length){h='<div style="text-align:center;opacity:.5;padding:18px">Keranjang kosong wok</div>'; document.getElementById('payBtn').style.display='none';} else document.getElementById('payBtn').style.display='block';
 document.getElementById('cartList').innerHTML=h;
 document.getElementById('cartTotal').innerText=cart.length?'Total: Rp '+tot.toLocaleString('id-ID'):'';
 document.getElementById('cartModal').style.display='block';
}
function closeCart(){document.getElementById('cartModal').style.display='none';}
render();
</script>
</body>
</html>
