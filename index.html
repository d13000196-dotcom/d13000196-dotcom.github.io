<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="format-detection" content="telephone=no"><title>DAP ORDER APK - OFFICIAL SHOP iOS+ANDROID</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{background:#07070b;color:#fff;font-family:Poppins,sans-serif;overflow-x:hidden;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}video::-webkit-media-controls{display:none!important}.top{text-align:center;padding:22px 14px 10px;padding-top:calc(22px + env(safe-area-inset-top))}.top h1{font-size:2rem;letter-spacing:2px;font-weight:800}.top p{opacity:.5;font-size:.8rem;letter-spacing:3px;margin-top:4px}.video-layers-wrap{width:95%;max-width:1100px;margin:14px auto 20px;border-radius:22px;overflow:hidden;height:420px;background:#000;position:relative;border:1px solid #ff004033}.video-layers-wrap video{width:100%;height:100%;object-fit:cover}.btn-video-active{position:absolute;right:14px;bottom:14px;background:#ff0a32;color:#fff;padding:8px 16px;border-radius:999px;font-size:.72rem;font-weight:800;z-index:2}.sound-btn{position:absolute;left:14px;bottom:14px;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);border:1px solid #ffffff33;color:#fff;padding:10px 16px;border-radius:999px;font-size:.72rem;cursor:pointer;z-index:3}.products{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:12px}@media(min-width:700px){.products{grid-template-columns:repeat(3,1fr)}}.card{background:#12121a;border:1px solid #1e1e2a;border-radius:16px;padding:10px}.card img{width:100%;height:150px;object-fit:cover;border-radius:12px;background:#0e0e14;display:block}.card-title{font-weight:700;margin-top:8px;font-size:.9rem}.price-row{display:flex;justify-content:space-between;margin:8px 0}.price{font-weight:800;color:#00ff88}.up-tab{border:1px dashed #ffe600;background:rgba(255,230,0,.08);border-radius:10px;padding:8px;margin-top:8px;font-size:.72rem}.up-tab.locked{opacity:.6}.up-tab.up-head{color:#ffe600;font-weight:800;margin-bottom:4px}.up-tab button{width:100%;margin-top:6px;padding:8px;border:none;border-radius:8px;font-weight:800;cursor:pointer;background:#ffe600;color:#000}.up-tab.locked button{background:#333;color:#777}.btn{width:100%;padding:10px;border:none;border-radius:10px;font-weight:800;cursor:pointer}.btn-r{background:#ff0a32;color:#fff}.btn-b{background:#0a84ff;color:#fff}#floatCart{position:fixed;right:18px;bottom:calc(22px + env(safe-area-inset-bottom));width:60px;height:60px;background:linear-gradient(135deg,#00c6ff,#7a00ff);border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:9999;cursor:grab;touch-action:none}#cart{position:fixed;right:-380px;top:0;width:360px;max-width:90vw;height:100dvh;background:#0f0f17;border-left:1px solid #222;transition:.35s;z-index:9998;padding:16px;display:flex;flex-direction:column}#cart.open{right:0}#cartOverlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:9997}#cartOverlay.show{display:block}</style></head><body>
<div class="top"><h1>DAP ORDER APK</h1><p>OFFICIAL SHOP • iOS + ANDROID</p></div>
<div class="video-layers-wrap"><video id="layersVideo" autoplay loop muted playsinline webkit-playsinline x5-playsinline preload="auto" poster="darkverse-layers.jpg" src="darkverse-layers.mp4"></video><button class="btn-video-active">VIDEO ACTIVE</button><button class="sound-btn" id="soundBtn">🔊 TAP UNTUK SUARA</button></div>
<div class="products" id="prod"></div>
<div id="cartOverlay" onclick="closeCart()"></div>
<div id="floatCart">🛒<span id="cc" style="position:absolute;top:-4px;right:-4px;background:#ff0a32;width:20px;height:20px;border-radius:50%;font-size:.68rem;display:flex;align-items:center;justify-content:center">0</span></div>
<div id="cart"><div style="display:flex;justify-content:space-between"><h3>Keranjang</h3><span onclick="closeCart()">✕</span></div><div id="citems" style="flex:1;overflow:auto;margin:12px 0"></div><div id="ctotal" style="font-weight:800"></div><button class="btn btn-r" style="margin-top:12px" onclick="goPay()">LANJUT KE PAYMENT →</button><button class="btn" style="background:#1e1e2e;margin-top:8px" onclick="closeCart()">Tutup</button></div>
<script>
const DATA=[{app:'darkverse',name:'DarkVerse',img:'darkverse.jpg',tiers:[{id:'dark-user',label:'FULL USER',price:50000},{id:'dark-reseller',label:'RESELLER',price:80000},{id:'dark-owner',label:'OWNER',price:150000}]},{app:'tr4svoid',name:'TR4SVLOID',img:'tr4svoid.jpg',tiers:[{id:'tr-user',label:'USER',price:25000},{id:'tr-reseller',label:'RESELLER',price:45000}]},{app:'xgtrash',name:'XG Trash',img:'xgtrash.jpg',tiers:[{id:'xg-user',label:'USER',price:20000},{id:'xg-reseller',label:'RESELLER',price:35000}]}];
let owned=JSON.parse(localStorage.getItem('owned')||'[]');let cart=JSON.parse(localStorage.getItem('cart')||'[]');
function getOwnedForApp(a){let d=DATA.find(x=>x.app===a);if(!d)return null;let b=null;d.tiers.forEach(t=>{if(owned.includes(t.id)){if(!b||t.price>b.price)b=t}});return b;}
function render(){let h='';DATA.forEach(app=>{const ot=getOwnedForApp(app.app);app.tiers.forEach(t=>{let up=null,can=false,txt='';if(ot&&t.price>ot.price){up=t.price-ot.price;can=true;txt=`Up ${ot.label}→${t.label} Rp ${up.toLocaleString('id-ID')}`;}else if(!ot){let low=app.tiers.find(x=>x.price<t.price);if(low){up=t.price-low.price;txt=`Up ${low.label}→${t.label} Rp ${up.toLocaleString('id-ID')}`;}else txt=`Beli ${t.label} unlock Up Role`; }else txt=`Punya ${ot.label}`;const lock=!can;const fb=`https://via.placeholder.com/400x300/0a0a0f/ff0040?text=${encodeURIComponent(app.name+'+'+t.label)}`;h+=`<div class="card"><img src="${app.img}" onerror="this.src='${fb}'"><div class="card-title">${app.name} - ${t.label}</div><div class="price-row"><div class="price">Rp ${t.price.toLocaleString('id-ID')}</div></div><button class="btn ${t.label.includes('RESELLER')||t.label.includes('OWNER')?'btn-b':'btn-r'}" onclick="add('${t.id}',${t.price},'${app.name} ${t.label}')">BELI</button><div class="up-tab ${lock?'locked':''}"><div class="up-head">${lock?'🔒 TAB UP ROLE (LOCK)':'🔓 TAB UP ROLE'}</div><div>${txt}</div><button ${lock?'disabled':''} onclick="${can?`add('${t.id}',${up},'UP ROLE ${app.name}')`:''}">${can?`UP ROLE Rp ${up.toLocaleString('id-ID')}`:'LOCKED'}</button></div></div>`;});});document.getElementById('prod').innerHTML=h;}
function add(id,p,n){cart.push({id,price:p,name:n});localStorage.setItem('cart',JSON.stringify(cart));upd();openCart();}function upd(){let tot=0,h='';cart.forEach((c,i)=>{tot+=c.price;h+=`<div style="display:flex;justify-content:space-between;background:#1a1a26;margin:6px 0;padding:10px;border-radius:10px;font-size:.82rem"><span>${c.name}</span><span>Rp ${c.price.toLocaleString('id-ID')} <b onclick="rem(${i})" style="color:#ff4d6d;cursor:pointer">✕</b></span></div>`;});document.getElementById('citems').innerHTML=h||'Kosong';document.getElementById('ctotal').innerText='Total: Rp '+tot.toLocaleString('id-ID');document.getElementById('cc').innerText=cart.length;}function rem(i){cart.splice(i,1);localStorage.setItem('cart',JSON.stringify(cart));upd();}function openCart(){document.getElementById('cart').classList.add('open');document.getElementById('cartOverlay').classList.add('show');}function closeCart(){document.getElementById('cart').classList.remove('open');document.getElementById('cartOverlay').classList.remove('show');}function goPay(){if(cart.length===0)return alert('kosong');location.href='payment.html';}
const fc=document.getElementById('floatCart');let isDrag=false,sx,sy,ol,ot,moved=false;function gp(e){return e.touches?e.touches[0]:e;}function ds(e){isDrag=true;moved=false;let p=gp(e);sx=p.clientX;sy=p.clientY;let r=fc.getBoundingClientRect();ol=r.left;ot=r.top;fc.style.transition='none';}function dm(e){if(!isDrag)return;let p=gp(e);let dx=p.clientX-sx,dy=p.clientY-sy;if(Math.abs(dx)>5||Math.abs(dy)>5)moved=true;let nl=ol+dx,nt=ot+dy;nl=Math.max(8,Math.min(window.innerWidth-fc.offsetWidth-8,nl));nt=Math.max(8,Math.min(window.innerHeight-fc.offsetHeight-8,nt));fc.style.left=nl+'px';fc.style.top=nt+'px';fc.style.right='auto';fc.style.bottom='auto';e.preventDefault();}function de(){isDrag=false;fc.style.transition='';setTimeout(()=>moved=false,100);}fc.addEventListener('mousedown',ds);fc.addEventListener('touchstart',ds,{passive:false});window.addEventListener('mousemove',dm,{passive:false});window.addEventListener('touchmove',dm,{passive:false});window.addEventListener('mouseup',de);window.addEventListener('touchend',de);fc.addEventListener('click',()=>{if(!moved)openCart();});
const v=document.getElementById('layersVideo');const sb=document.getElementById('soundBtn');const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function unmute(){v.muted=false;v.volume=0.7;v.play().then(()=>{sb.innerText='🔊 SUARA AKTIF 120FPS HD+';sb.style.background='#00ff8855';setTimeout(()=>sb.style.display='none',2000);}).catch(()=>{v.muted=true;v.play();});}
sb.onclick=unmute;document.body.addEventListener('click',()=>{if(v.muted)unmute();},{once:true});if(isIOS)sb.innerText='🔊 TAP UNTUK SUARA iOS';
render();upd();
</script></body></html>
