<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DAP ORDER APK - OFFICIAL STORE GOLD</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Poppins:wght@600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0800;color:#fff;font-family:Poppins,sans-serif;overflow-x:hidden}
canvas#bgCanvas{position:fixed;inset:0;z-index:-2}
.overlay{position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 50% 0%,rgba(255,215,0,.15) 0%,rgba(0,0,0,.95) 70%)}
.wrap{max-width:720px;margin:0 auto;padding:12px;z-index:2;position:relative}
.mp3bar{border:1.5px solid #ffd700;background:linear-gradient(90deg,#0f0f0f,#1a1500);border-radius:12px;padding:10px;text-align:center;color:#ffd700;font-weight:800;font-size:11px;box-shadow:0 0 15px #ffd70044;margin-bottom:14px;cursor:pointer}
.hero{text-align:center;padding:12px 0}
.hero h1{font-family:Orbitron;font-size:30px;background:linear-gradient(90deg,#c9a86a,#ffd700);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.prod-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
.card{border:1.5px solid #3a2e14;background:linear-gradient(180deg,#1a160a,#0f0d05);border-radius:16px;overflow:hidden;position:relative;box-shadow:0 0 15px rgba(255,215,0,.12)}
.card:before{content:'';position:absolute;top:0;left:0;width:100%;height:2px;background:linear-gradient(90deg,transparent,#ffd700,transparent)}
.card img{width:100%;height:140px;object-fit:cover;background:#000;display:block}
.card-info{padding:9px}
.card-title{font-size:10.5px;font-weight:700;min-height:32px}
.card-price{color:#ffd700;font-weight:800;font-size:13.5px;margin:5px 0}
.btn-buy{width:100%;padding:8px;border:none;border-radius:9px;background:linear-gradient(90deg,#c9a86a,#ffd700);color:#000;font-weight:900;font-size:10.5px;cursor:pointer}
.cat{grid-column:1/-1;background:linear-gradient(90deg,#1a160a,#2a2300);border:1px solid #ffd70044;border-radius:10px;padding:8px;text-align:center;color:#ffd700;font-weight:800;font-size:12px;letter-spacing:2px;margin-top:6px}
#cartFloat{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:12px;z-index:999;touch-action:none}
.fbtn{width:56px;height:56px;border-radius:50%;border:1.5px solid #ffd700;display:flex;align-items:center;justify-content:center;font-size:24px;cursor:grab;box-shadow:0 0 20px #ffd70055;user-select:none}
.fbtn:active{cursor:grabbing;transform:scale(1.1)}
.f1{background:linear-gradient(180deg,#1a160a,#2a2300)}
.f2{background:linear-gradient(180deg,#4a3a00,#ffd700);color:#000}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:1000;display:none;align-items:center;justify-content:center;padding:16px}
.modal-box{background:#111;border:1.5px solid #ffd700;border-radius:16px;padding:16px;max-width:400px;width:100%;max-height:80vh;overflow:auto;position:relative;touch-action:none;cursor:grab}
.modal-box:active{cursor:grabbing}
.marquee{overflow:hidden;white-space:nowrap;background:#0f0d05;border:1px solid #2a2310;border-radius:10px;padding:8px;margin:10px 0}
.marquee-track{display:inline-flex;animation:scroll 20s linear infinite;gap:12px}
@keyframes scroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.bukti-card{min-width:180px;background:#1a160a;border:1px solid #3a2e14;border-radius:10px;padding:6px}
.bukti-card img{width:100%;height:100px;object-fit:cover;border-radius:8px}
</style>
</head>
<body>
<canvas id="bgCanvas"></canvas><div class="overlay"></div>
<div class="wrap">
<div class="mp3bar" id="mp3Bar" onclick="toggleMusic()" ondblclick="nextMusic()">🔊 MP3 "DAP-ORDER-APK-GOLD.mp3" PLAYING 🟢 - TAP PAUSE - 2X TAP GANTI</div>
<audio id="audioPlayer" loop autoplay><source src="DAP-ORDER-APK-GOLD.mp3" type="audio/mpeg"><source src="DAP-ORDER-APK-GOLD.mp3" type="audio/mpeg"></audio>
<div class="hero"><h1>DAP ORDER APK</h1><p style="letter-spacing:4px;color:#c9a86a;font-size:11px">OFFICIAL SHOP • GOLD V49 DRAG</p></div>
<div class="prod-grid" id="prodGrid"></div>
<div style="text-align:center;margin-top:18px;padding:12px;border:1px solid #222;border-radius:12px;background:#0a0a0a"><div style="color:#ffd700;font-weight:800" id="totalEl">Total: Rp 0</div><button onclick="location.href='payment.html'" style="margin-top:10px;width:100%;padding:12px;background:linear-gradient(90deg,#ffd700,#c9a86a);border:none;border-radius:10px;font-weight:800;color:#000">CHECKOUT → PAYMENT GOLD</button></div>

<!-- DASHBOARD BUKTI TRANSFER GERAK -->
<div style="margin-top:16px;border:1.5px solid #3a2e14;border-radius:12px;background:linear-gradient(180deg,#1a160a,#0f0d05);padding:10px">
<div style="text-align:center;color:#ffd700;font-weight:800;font-size:12px;letter-spacing:2px">📋 DASHBOARD BUKTI TRANSFER - GERAK OTOMATIS 📋</div>
<div class="marquee"><div class="marquee-track" id="marqueeTrack"></div></div>
<div id="dashboardList" style="margin-top:8px"></div>
</div>
</div>

<!-- PANEL KERANJANG DRAG -->
<div id="cartFloat">
<div class="fbtn f1" id="dragCart" onclick="showCart()">📋</div>
<div class="fbtn f2" id="dragBuy" onclick="location.href='payment.html'">🛒</div>
</div>

<div class="modal" id="cartModal"><div class="modal-box" id="cartBox"><h3 style="color:#ffd700">🛒 Keranjang - DRAG PANEL INI</h3><div id="cartList" style="margin:10px 0"></div><button onclick="location.href='payment.html'" style="width:100%;padding:12px;background:linear-gradient(90deg,#ffd700,#c9a86a);border:none;border-radius:10px;font-weight:800;color:#000">BAYAR SEKARANG</button><button onclick="document.getElementById('cartModal').style.display='none'" style="width:100%;margin-top:8px;background:#222;color:#fff;border:1px solid #333;padding:10px;border-radius:10px">Tutup</button></div></div>

<script>
// BACKGROUND PELANGI GERAK
const canvas=document.getElementById('bgCanvas');const ctx=canvas.getContext('2d');let w,h,particles=[];function resize(){w=canvas.width=window.innerWidth;h=canvas.height=window.innerHeight}window.addEventListener('resize',resize);resize();for(let i=0;i<70;i++){particles.push({x:Math.random()*w,y:Math.random()*h,r:Math.random()*2+1,c:`hsl(${Math.random()*60+35},100%,50%)`,vx:(Math.random()-0.5)*0.5,vy:(Math.random()-0.5)*0.5})}function anim(){ctx.clearRect(0,0,w,h);particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>w)p.vx*=-1;if(p.y<0||p.y>h)p.vy*=-1;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=p.c;ctx.shadowBlur=10;ctx.shadowColor=p.c;ctx.fill();});requestAnimationFrame(anim)}anim();

// AUDIO BACKUP
let audio=document.getElementById('audioPlayer');let isPlay=true;function toggleMusic(){if(isPlay){audio.pause();document.getElementById('mp3Bar').innerText='🔇 MP3 PAUSED - TAP PLAY';}else{audio.play();document.getElementById('mp3Bar').innerText='🔊 MP3 "DAP-ORDER-GOLD-V49.mp3" PLAYING 🟢 - TAP PAUSE';}isPlay=!isPlay;}function nextMusic(){audio.src=audio.src.includes('V49')?'DAP-ORDER-APK-GOLD.mp3':'DAP-ORDER-APK-GOLD-V49.mp3';audio.play();}

// DRAG SYSTEM - KERANJANG
function makeDraggable(el){
let pos1=0,pos2=0,pos3=0,pos4=0;
el.onmousedown=dragMouseDown;el.ontouchstart=dragMouseDown;
function dragMouseDown(e){e=e||window.event;e.preventDefault();if(e.type==='touchstart'){pos3=e.touches[0].clientX;pos4=e.touches[0].clientY;}else{pos3=e.clientX;pos4=e.clientY;}document.onmouseup=closeDrag;document.ontouchend=closeDrag;document.onmousemove=elementDrag;document.ontouchmove=elementDrag;}
function elementDrag(e){e=e||window.event;e.preventDefault();let clientX,clientY;if(e.type==='touchmove'){clientX=e.touches[0].clientX;clientY=e.touches[0].clientY;}else{clientX=e.clientX;clientY=e.clientY;}pos1=pos3-clientX;pos2=pos4-clientY;pos3=clientX;pos4=clientY;el.style.top=(el.offsetTop-pos2)+"px";el.style.left=(el.offsetLeft-pos1)+"px";el.style.bottom='auto';el.style.right='auto';el.style.position='fixed';}
function closeDrag(){document.onmouseup=null;document.onmousemove=null;document.ontouchend=null;document.ontouchmove=null;}
}
makeDraggable(document.getElementById('cartFloat'));makeDraggable(document.getElementById('cartBox'));

// PRODUK 14 - JPG
let produk=[{c:"DarkVerse",n:"DarkVerse - FULL UPDATE",h:50000,i:"darkverse.jpg"},{c:"DarkVerse",n:"DarkVerse - RESELLER",h:80000,i:"darkverse.jpg"},{c:"DarkVerse",n:"DarkVerse - PARTNER",h:150000,i:"darkverse.jpg"},{c:"X-GTR4SH",n:"X-GTR4SH - FULL UPDATE",h:20000,i:"xgtr4sh.jpg"},{c:"X-GTR4SH",n:"X-GTR4SH - RESELLER",h:30000,i:"xgtr4sh.jpg"},{c:"X-GTR4SH",n:"X-GTR4SH - ADMIN",h:50000,i:"xgtr4sh.jpg"},{c:"X-GTR4SH",n:"X-GTR4SH - PARTNER",h:70000,i:"xgtr4sh.jpg"},{c:"X-GTR4SH",n:"X-GTR4SH - MODERATOR",h:100000,i:"xgtr4sh.jpg"},{c:"TRAPENDEN",n:"APK TRAPENDEN - FULL UPDATE",h:25000,i:"trapenden.jpg"},{c:"TRAPENDEN",n:"APK TRAPENDEN - RESELLER",h:45000,i:"trapenden.jpg"},{c:"TRAPENDEN",n:"APK TRAPENDEN - ADMIN",h:55000,i:"trapenden.jpg"},{c:"TRAPENDEN",n:"APK TRAPENDEN - VIP",h:60000,i:"trapenden.jpg"},{c:"TRAPENDEN",n:"APK TRAPENDEN - PT",h:80000,i:"trapenden.jpg"},{c:"TRAPENDEN",n:"APK TRAPENDEN - MODERATOR",h:100000,i:"trapenden.jpg"}];
let cart=JSON.parse(localStorage.getItem('dap_cart_detail')||'[]');let total=parseInt(localStorage.getItem('dap_total')||'0');
function fmt(n){return 'Rp '+n.toLocaleString('id-ID');}
function render(){let grid=document.getElementById('prodGrid');let html='';let lastCat='';produk.forEach((p,idx)=>{if(p.c!==lastCat){html+=`<div class="cat">🔥 ${p.c} 🔥</div>`;lastCat=p.c;}let fb=`https://via.placeholder.com/400x300.jpg?text=${encodeURIComponent(p.n)}`;html+=`<div class="card"><img src="${p.i}" onerror="this.src='${fb}'"><div class="card-info"><div class="card-title">${p.n}</div><div class="card-price">${fmt(p.h)}</div><button class="btn-buy" onclick="tambah(${idx})">BELI / BUY</button></div></div>`;});grid.innerHTML=html;document.getElementById('totalEl').innerText='Total: '+fmt(total);renderBukti();}
function tambah(i){let p=produk[i];cart.push({nama:p.n,harga:p.h});total+=p.h;localStorage.setItem('dap_cart_detail',JSON.stringify(cart));localStorage.setItem('dap_total',total);render();if(navigator.vibrate)navigator.vibrate(50);}
function showCart(){document.getElementById('cartModal').style.display='flex';renderCart();}
function renderCart(){let el=document.getElementById('cartList');if(cart.length===0)el.innerHTML='<div style="opacity:.5;text-align:center">Kosong</div>';else{let h='';cart.forEach((c,idx)=>{h+=`<div style="display:flex;justify-content:space-between;margin:6px 0;font-size:13px"><span>${c.nama}</span><span>${fmt(c.harga)} <span onclick="hapus(${idx})" style="color:red;cursor:pointer">x</span></span></div>`});el.innerHTML=h;}}
function hapus(idx){cart.splice(idx,1);total=cart.reduce((a,b)=>a+b.harga,0);localStorage.setItem('dap_cart_detail',JSON.stringify(cart));localStorage.setItem('dap_total',total);render();renderCart();}
function renderBukti(){
let list=JSON.parse(localStorage.getItem('dap_bukti')||'[]');
let track=document.getElementById('marqueeTrack');
let listEl=document.getElementById('dashboardList');
if(list.length===0){track.innerHTML='<div style="opacity:.5">Belum ada bukti transfer - upload di payment.html</div>';listEl.innerHTML='';return;}
let html='';list.forEach(b=>{html+=`<div class="bukti-card"><div style="font-size:9px;opacity:.7">${b.time}</div><img src="${b.img}"><div style="font-size:10px;color:#ffd700">${b.method} - Rp ${parseInt(b.total).toLocaleString()}</div></div>`;});
track.innerHTML=html+html; // double for loop gerak
let html2='';list.slice(0,6).forEach(b=>{html2+=`<div style="background:#1a160a;border:1px solid #2a2310;border-radius:10px;padding:8px;margin:6px 0;display:flex;gap:8px"><img src="${b.img}" style="width:60px;height:60px;border-radius:8px;object-fit:cover"><div><div style="font-size:10px;opacity:.7">${b.time}</div><div style="font-size:11px;color:#ffd700">${b.method}</div><div style="font-size:11px">Rp ${parseInt(b.total).toLocaleString()}</div></div></div>`;});
listEl.innerHTML=html2;
}
render();
</script>
</body>
</html>
