<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>DAP ORDER APK</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#07070b;color:#fff;font-family:Poppins,sans-serif}.top{text-align:center;padding:18px 14px 10px}.top h1{font-size:1.9rem;letter-spacing:2.5px;font-weight:800}.desc-box{max-width:700px;margin:12px auto 0;background:rgba(255,255,255,0.05);border:1px solid #ffffff14;border-radius:14px;padding:12px 14px;text-align:center}.desc-text{font-size:.78rem;opacity:.85}.tags{margin-top:8px;display:flex;justify-content:center;gap:8px}.tag{padding:4px 10px;border-radius:999px;font-size:.68rem;font-weight:700}.tag-green{background:#00ff8815;border:1px solid #00ff8844;color:#00ff88}.tag-blue{background:#00c6ff15;border:1px solid #00c6ff44;color:#00c6ff}.tag-yellow{background:#ffe60015;border:1px solid #ffe60044;color:#ffe600}.country{display:flex;justify-content:center;gap:8px;margin:12px auto}.country button{padding:6px 14px;border-radius:999px;border:1px solid #333;background:#1a1a26;color:#fff;font-weight:700;font-size:.78rem;cursor:pointer}.country button.active{background:#fff;color:#000}.notes{width:95%;max-width:1100px;margin:10px auto;background:rgba(255,230,0,0.15);border:1px dashed #ffe600;border-radius:12px;padding:10px;text-align:center;font-size:.8rem;font-weight:800;color:#ffe600;animation:blink 1.5s infinite;cursor:pointer}@keyframes blink{0%,100%{opacity:1}50%{opacity:.6}}.video-wrap-neon{width:95%;max-width:1100px;margin:0 auto 20px;position:relative;border-radius:22px;padding:1.5px;background:linear-gradient(90deg,#7a00ff,#00c6ff);box-shadow:0 0 12px rgba(122,0,255,0.4),0 0 25px rgba(0,198,255,0.25)}.video-wrap{width:100%;height:380px;background:#000;position:relative;border-radius:21px;overflow:hidden;cursor:pointer}.video-wrap video{width:100%;height:100%;object-fit:cover;display:block;background:#000}.btn-video{position:absolute;right:14px;bottom:14px;background:#ff0a32;color:#fff;padding:6px 12px;border-radius:999px;font-size:.68rem;font-weight:800;z-index:3;pointer-events:none}.sound{position:absolute;left:14px;bottom:14px;background:rgba(0,0,0,0.6);border:1px solid rgba(0,255,136,0.5);color:#00ff88;padding:6px 10px;border-radius:999px;font-size:.66rem;z-index:3;pointer-events:none;backdrop-filter:blur(8px);font-weight:700}.products{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:12px}.card{background:#12121a;border:1px solid #1e1e2a;border-radius:16px;padding:10px}.card img{width:100%;height:145px;object-fit:cover;border-radius:12px;background:#0e0e14;display:block}.card-title{font-weight:700;margin-top:8px;font-size:.84rem}.price{font-weight:800;color:#00ff88;margin:6px 0}.price small{color:#888;font-size:.68rem;display:block}.up-tab{border:1px dashed #ffe600;background:rgba(255,230,0,.08);border-radius:10px;padding:8px;margin-top:8px;font-size:.68rem}.up-tab button{width:100%;margin-top:6px;padding:8px;border:none;border-radius:8px;font-weight:800;cursor:pointer;background:#ffe600;color:#000}.up-tab.locked{opacity:.55}.up-tab.locked button{background:#333;color:#777}.btn{width:100%;padding:10px;border:none;border-radius:10px;font-weight:800;cursor:pointer}.btn-r{background:#ff0a32;color:#fff}.btn-b{background:#0a84ff;color:#fff}
#floatCart{position:fixed;right:18px;bottom:22px;width:60px;height:60px;background:linear-gradient(135deg,#00c6ff,#7a00ff);border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:9999}#cart{position:fixed;right:-400px;top:0;width:380px;max-width:92vw;height:100vh;background:#0f0f17;border-left:1px solid #222;transition:.35s;z-index:9998;padding:16px;display:flex;flex-direction:column}#cart.open{right:0}#cartOverlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:9997}#cartOverlay.show{display:block}
</style></head><body>
<div class="top"><h1>DAP ORDER APK</h1><p>OFFICIAL SHOP</p><div class="desc-box"><div class="desc-text">HAI, PENGGUNAAN WEBSITE!, INI WEBSITE JUAL BELI APLIKASI BUG WHATSAPP.</div><div class="tags"><span class="tag tag-green">STABIL</span><span class="tag tag-blue">OTOMATIS</span><span class="tag tag-yellow">AMAN</span></div></div><div class="country"><button id="btnID" class="active" onclick="setCountry('ID')">🇮🇩 ID - Rp</button><button id="btnMY" onclick="setCountry('MY')">🇲🇾 MY - RM</button></div></div>
<div class="notes" id="notesBox" onclick="activateMedia()">⚠️ KLIK / PENCET LAYERS UNTUK MENGAKTIFKAN SOUND LAYERS..!!</div>
<div class="video-wrap-neon"><div class="video-wrap" id="videoWrap" onclick="activateMedia()"><video id="layersVideo" autoplay loop muted playsinline webkit-playsinline x5-playsinline preload="auto" poster="darkverse.jpg"></video><div class="btn-video">VIDEO ACTIVE</div><div class="sound" id="soundLabel">🔊 TAP LAYERS UNTUK SUARA</div></div></div>
<audio id="bgAudio" loop preload="auto"></audio>
<div class="products" id="prod"></div>
<div id="cartOverlay" onclick="closeCart()"></div><div id="floatCart">🛒<span id="cc" style="position:absolute;top:-4px;right:-4px;background:#ff0a32;width:20px;height:20px;border-radius:50%;font-size:.68rem;display:flex;align-items:center;justify-content:center;font-weight:800">0</span></div><div id="cart"><div style="display:flex;justify-content:space-between"><h3>Keranjang</h3><span onclick="closeCart()" style="cursor:pointer">✕</span></div><div id="citems" style="flex:1;overflow:auto;margin:12px 0"></div><div id="ctotal" style="font-weight:800;text-align:center"></div><button class="btn btn-r" style="margin-top:12px" onclick="goPay()">LANJUT PAYMENT →</button></div>
<script>
const v=document.getElementById('layersVideo');const a=document.getElementById('bgAudio');
const vSrcs=["darkverse-layers.mp4","video.mp4","layers.mp4"];const aSrcs=["darkverse.mp3","audio.mp3","music.mp3","darkverse-layers.mp3","song.mp3"];
let vi=0,ai=0;function tryV(){if(vi>=vSrcs.length)return;v.src=vSrcs[vi]+"?v="+Date.now();v.load();v.play().catch(()=>{vi++;tryV();});}
function tryA(){if(ai>=aSrcs.length)return;a.src=aSrcs[ai]+"?v="+Date.now();a.load();}
v.addEventListener('error',()=>{vi++;tryV();});a.addEventListener('error',()=>{ai++;tryA();});tryV();tryA();
let soundActive=false;
function activateMedia(){if(soundActive)return;a.volume=0.8;a.play().then(()=>{soundActive=true;document.getElementById('soundLabel').innerText='🔊 SOUND ON';document.getElementById('notesBox').innerHTML='✅ SOUND AKTIF';document.getElementById('notesBox').style.background='rgba(0,255,136,0.2)';document.getElementById('notesBox').style.borderColor='#00ff88';document.getElementById('notesBox').style.color='#00ff88';}).catch(()=>{ai++;tryA();setTimeout(()=>{soundActive=false;activateMedia();},500);});v.play().catch(()=>{});v.muted=false;}
document.addEventListener('click',activateMedia,{once:true});document.addEventListener('touchstart',activateMedia,{once:true});
let country=localStorage.getItem('country')||'ID';const RATE=3600;
function setCountry(c){country=c;localStorage.setItem('country',c);document.getElementById('btnID').classList.toggle('active',c==='ID');document.getElementById('btnMY').classList.toggle('active',c==='MY');render();upd();}
function fmtIDR(n){return 'Rp '+n.toLocaleString('id-ID');}function fmtMYR(n){return 'RM '+(n/RATE).toFixed(2);}
function priceDisplay(n){return country==='MY'?fmtMYR(n)+`<small>${fmtIDR(n)}</small>`:fmtIDR(n)+`<small>${fmtMYR(n)}</small>`;}
const DATA=[
{app:'darkverse',name:'DarkVerse',img:'darkverse.jpg',tiers:[{id:'dv-full',label:'FULL UPDATE',price:50000},{id:'dv-reseller',label:'RESELLER',price:80000},{id:'dv-partner',label:'PARTNER',price:150000}]},
{app:'tr4svloid',name:'TR4SVLOID',img:'tr4svloid.jpg',tiers:[{id:'tr-1mgg',label:'1 MINGGU',price:10000},{id:'tr-1bln',label:'1 BULAN',price:15000},{id:'tr-full',label:'FULL UPDATE',price:25000},{id:'tr-reseller',label:'RESELLER',price:55000},{id:'tr-vip1bln',label:'VIP 1 BULAN',price:30000},{id:'tr-vipperm',label:'VIP PERMANEN',price:50000},{id:'tr-partner',label:'PARTNER',price:65000}]},
{app:'xgtr4sh',name:'X-GTR4SH',img:'xgtr4sh.jpg',tiers:[{id:'xg-full',label:'FULL UPDATE',price:20000},{id:'xg-reseller',label:'RESELLER',price:30000},{id:'xg-admin',label:'ADMIN',price:50000},{id:'xg-partner',label:'PARTNER',price:70000},{id:'xg-mod',label:'MODERATOR',price:100000}]},
{app:'orca',name:'ORCA MALIGNANT',img:'orca.jpg',tiers:[{id:'orca-full',label:'FULL UPDATE',price:30000},{id:'orca-reseller',label:'RESELLER',price:45000},{id:'orca-admin',label:'ADMIN',price:55000},{id:'orca-vip',label:'VIP',price:75000},{id:'orca-partner',label:'PARTNER',price:60000},{id:'orca-mod',label:'MODERATOR',price:75000},{id:'orca-owner',label:'OWNER',price:100000},{id:'orca-ownervip',label:'OWNER VIP',price:120000}]}
];
let owned=JSON.parse(localStorage.getItem('owned')||'[]');let cart=JSON.parse(localStorage.getItem('cart')||'[]');
function getOwned(app){let d=DATA.find(x=>x.app===app);let b=null;d.tiers.forEach(t=>{if(owned.includes(t.id)){if(!b||t.price>b.price)b=t}});return b;}
function render(){let h='';DATA.forEach(app=>{let sorted=[...app.tiers].sort((a,b)=>a.price-b.price);app.tiers.forEach(t=>{let idx=sorted.findIndex(x=>x.id===t.id);let prev=idx>0?sorted[idx-1]:null;let up=null,can=false,txt='';if(prev){up=t.price-prev.price;can=true;let ot=getOwned(app.app);if(ot&&ot.price>=t.price){txt=`Punya ${ot.label}`;can=false;}else if(ot){txt=`Up ${ot.label} → ${t.label} ${fmtIDR(t.price-ot.price)}`;up=t.price-ot.price;}else{txt=`Up ${prev.label} → ${t.label} ${fmtIDR(up)}`;}}else{txt=`Beli ${t.label}`;can=false;}const locked=!can;h+=`<div class="card"><img src="${app.img}?v=${Date.now()}" onerror="this.src='darkverse.jpg'"><div class="card-title">${app.name} - ${t.label}</div><div class="price">${priceDisplay(t.price)}</div><button class="btn ${t.label.includes('RESELLER')||t.label.includes('PARTNER')?'btn-b':'btn-r'}" onclick="add('${t.id}',${t.price},'${app.name} ${t.label}')">BELI</button><div class="up-tab ${locked?'locked':''}"><div style="color:#ffe600;font-weight:800">🔓 TAB UP ROLE</div><div>${txt}</div><button ${!can?'disabled':''} onclick="${can?`add('${t.id}',${up},'UP ROLE ${app.name} ${t.label}')`:''}">${can?`UP ROLE ${fmtIDR(up)}`:'TIER AWAL'}</button></div></div>`;});});document.getElementById('prod').innerHTML=h;}
function add(id,price,name){let f=cart.find(c=>c.id===id);if(f)f.qty+=1;else cart.push({id,price,name,qty:1});localStorage.setItem('cart',JSON.stringify(cart));upd();openCart();}
function upd(){let tot=0,qty=0,h='';cart.forEach((c,i)=>{tot+=c.price*c.qty;qty+=c.qty;h+=`<div style="background:#1a1a26;margin:8px 0;padding:12px;border-radius:12px"><div style="display:flex;justify-content:space-between"><span>${c.name}</span><span>${fmtIDR(c.price*c.qty)}</span></div></div>`;});document.getElementById('citems').innerHTML=h||'Kosong';document.getElementById('ctotal').innerText='Total: '+fmtIDR(tot);document.getElementById('cc').innerText=qty;}
function openCart(){document.getElementById('cart').classList.add('open');document.getElementById('cartOverlay').classList.add('show');}function closeCart(){document.getElementById('cart').classList.remove('open');document.getElementById('cartOverlay').classList.remove('show');}function goPay(){if(cart.length===0)return alert('kosong');location.href='payment.html?v='+Date.now();}
const fc=document.getElementById('floatCart');let isDrag=false,sx,sy,ol,ot,moved=false;function gp(e){return e.touches?e.touches[0]:e;}function ds(e){isDrag=true;moved=false;let p=gp(e);sx=p.clientX;sy=p.clientY;let r=fc.getBoundingClientRect();ol=r.left;ot=r.top;fc.style.transition='none';}function dm(e){if(!isDrag)return;let p=gp(e);let dx=p.clientX-sx,dy=p.clientY-sy;if(Math.abs(dx)>5||Math.abs(dy)>5)moved=true;let nl=ol+dx,nt=ot+dy;nl=Math.max(8,Math.min(window.innerWidth-fc.offsetWidth-8,nl));nt=Math.max(8,Math.min(window.innerHeight-fc.offsetHeight-8,nt));fc.style.left=nl+'px';fc.style.top=nt+'px';fc.style.right='auto';fc.style.bottom='auto';e.preventDefault();}function de(){isDrag=false;fc.style.transition='';setTimeout(()=>moved=false,100);}fc.addEventListener('mousedown',ds);fc.addEventListener('touchstart',ds,{passive:false});window.addEventListener('mousemove',dm,{passive:false});window.addEventListener('touchmove',dm,{passive:false});window.addEventListener('mouseup',de);window.addEventListener('touchend',de);fc.addEventListener('click',()=>{if(!moved)openCart();});
render();upd();
</script></body></html>
