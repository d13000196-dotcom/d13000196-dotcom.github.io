<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DapOrderApk - RAINBOW TRANSPARENT v4.1</title>
<style>
:root{--green:#00ff88;--red:#ff0040;--purple:#a000ff;--silver:#c0c0c0;--orange:#ff8800;--yellow:#ffea00;--blue:#00d0ff;--trans:rgba(255,255,255,0.08);--bg:#0a0a0a}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Courier New',monospace}
body{background:var(--bg);color:#fff;overflow-x:hidden}
.matrix{position:fixed;top:0;left:0;width:100%;height:100%;opacity:0.07;pointer-events:none;z-index:0;background: repeating-linear-gradient(0deg, transparent, transparent 2px, var(--green) 2px, var(--green) 3px)}
.header{position:relative;z-index:2;border-bottom:2px solid var(--green);padding:12px;background:#111;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
.logo{font-size:22px;font-weight:900;color:var(--green);text-shadow:0 0 10px var(--green)}
.terminal-text{color:var(--green);font-size:12px;margin:10px 0;min-height:16px}
.nav{display:flex;gap:8px}
.btn-nav{border:1px solid var(--silver);padding:6px 12px;background:#000;color:var(--silver);cursor:pointer}
.btn-nav.active{border-color:var(--green);color:var(--green);box-shadow:0 0 8px var(--green)}
.layout{display:grid;grid-template-columns:260px 1fr;gap:14px;padding:14px;position:relative;z-index:2}
@media(max-width:800px){.layout{grid-template-columns:1fr}}
.sidebar{border:1px solid var(--silver);padding:12px;background:#0f0f0f;height:fit-content}
.sidebar h3{color:var(--yellow);margin:10px 0 6px;font-size:13px}
.badge{display:inline-block;border:1px solid;padding:3px 8px;font-size:11px;margin:3px 2px}
.b-green{border-color:var(--green);color:var(--green)}
.b-red{border-color:var(--red);color:var(--red)}
.b-purple{border-color:var(--purple);color:var(--purple)}
.b-silver{border-color:var(--silver);color:var(--silver)}
.b-orange{border-color:var(--orange);color:var(--orange)}
.b-yellow{border-color:var(--yellow);color:var(--yellow)}
.b-blue{border-color:var(--blue);color:var(--blue)}
.b-trans{border-color:rgba(255,255,255,0.4);color:#fff;background:rgba(255,255,255,0.08);backdrop-filter:blur(6px)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{border:2px solid;padding:12px;background:#111;transition:0.25s;position:relative}
.card:hover{transform:translateY(-4px);box-shadow:0 0 18px}
.card.c-green{border-color:var(--green)} .card.c-green h4{color:var(--green)}
.card.c-red{border-color:var(--red)} .card.c-red h4{color:var(--red)}
.card.c-purple{border-color:var(--purple)} .card.c-purple h4{color:var(--purple)}
.card.c-silver{border-color:var(--silver)} .card.c-silver h4{color:var(--silver)}
.card.c-orange{border-color:var(--orange)} .card.c-orange h4{color:var(--orange)}
.card.c-yellow{border-color:var(--yellow)} .card.c-yellow h4{color:var(--yellow)}
.card.c-blue{border-color:var(--blue)} .card.c-blue h4{color:var(--blue)}
.card.c-trans{border-color:rgba(255,255,255,0.35);background:linear-gradient(135deg, rgba(255,255,255,0.12), rgba(255,255,255,0.03));backdrop-filter:blur(12px)} 
.card.c-trans h4{color:#fff;text-shadow:0 0 10px #fff}
.card button{width:100%;margin-top:8px;padding:8px;background:#000;border:1px solid currentColor;color:inherit;cursor:pointer;font-weight:700}
.card button:hover{background:currentColor;color:#000}
.card.c-trans button{border-color:#fff;color:#fff}
.cart-box{margin-top:14px;border:1px dashed var(--yellow);padding:10px}
.cart-item{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222;padding:6px 0;font-size:12px}
.qty button{width:24px;height:24px;background:#000;border:1px solid #555;color:#fff;cursor:pointer}
</style>
</head>
<body>
<div class="matrix"></div>
<div class="header">
<div class="logo">DapOrderApk <span style="color:var(--silver)">// RAINBOW+TRANS v4.1</span></div>
<div class="nav">
<button class="btn-nav active">SHOP</button>
<button class="btn-nav" onclick="location.href='payment.html'">CART [<span id="cartCount">0</span>]</button>
<button class="btn-nav">ORDERS</button>
</div>
</div>
<div style="padding:8px 14px;z-index:2;position:relative" class="terminal-text" id="typeText">> initializing...</div>

<div class="layout">
<div class="sidebar">
<div><b>STATUS:</b> <span style="color:var(--green)">AUTHENTICATED</span></div>
<div><b>BACKUP:</b> <span style="color:var(--blue)">AUTO-SAVE ON [OK]</span></div>
<div style="margin:6px 0"><span class="badge b-green">700+ TRUSTED</span> <span class="badge b-yellow">READY</span> <span class="badge b-trans">GLASS</span></div>
<h3>FILTERS // 8 COLORS</h3>
<div class="badge b-green">[ GREEN ]</div>
<div class="badge b-red">[ RED ]</div>
<div class="badge b-purple">[ PURPLE ]</div>
<div class="badge b-silver">[ SILVER ]</div>
<div class="badge b-orange">[ ORANGE ]</div>
<div class="badge b-yellow">[ YELLOW ]</div>
<div class="badge b-blue">[ BLUE ]</div>
<div class="badge b-trans">[ TRANSPARENT ]</div>
<div class="cart-box">
<b>CART PREVIEW // BACKUP SAFE</b>
<div id="cartPreview">empty</div>
<button onclick="clearCart()" style="margin-top:8px;width:100%;border:1px solid var(--red);color:var(--red);background:#000;padding:5px;cursor:pointer">KOSONGKAN KERANJANG</button>
</div>
</div>

<div>
<div class="grid" id="productGrid"></div>
</div>
</div>

<script>
const CART_KEY = 'daporder_cart';
let cart = JSON.parse(localStorage.getItem(CART_KEY) || '[]');

const products = [
{id:1,name:'CYBER HOODIE V2',price:350000,color:'green',stock:12},
{id:2,name:'MECHA KEYCHAIN RED',price:50000,color:'red',stock:20},
{id:3,name:'NEON PURPLE CAP',price:120000,color:'purple',stock:8},
{id:4,name:'SILVER CHAIN 925',price:200000,color:'silver',stock:5},
{id:5,name:'ORANGE DRONE PROP',price:75000,color:'orange',stock:15},
{id:6,name:'YELLOW GLOW TAPE',price:30000,color:'yellow',stock:30},
{id:7,name:'BLUE LIGHT GLASSES',price:150000,color:'blue',stock:10},
{id:8,name:'GHOST GLASS CASE',price:95000,color:'trans',stock:7},
];

function saveCart(){localStorage.setItem(CART_KEY, JSON.stringify(cart)); updateUI();}
function addToCart(id){let p=products.find(x=>x.id===id);let f=cart.find(x=>x.id===id);if(f){f.qty++}else{cart.push({...p,qty:1})}saveCart();}
function changeQty(id,delta){let f=cart.find(x=>x.id===id);if(!f)return;f.qty+=delta;if(f.qty<=0){cart=cart.filter(x=>x.id!==id)}saveCart();}
function clearCart(){cart=[];saveCart();}

function updateUI(){
document.getElementById('cartCount').innerText = cart.reduce((a,b)=>a+b.qty,0);
let grid=document.getElementById('productGrid');
grid.innerHTML = products.map(p=>`
<div class="card c-${p.color}">
<h4>${p.name}</h4>
<div style="font-size:11px;margin:6px 0">STOCK: ${p.stock} <span class="badge b-${p.color}">${p.color.toUpperCase()}</span></div>
<div style="font-weight:900">Rp ${p.price.toLocaleString('id-ID')}</div>
<button onclick="addToCart(${p.id})">[ ADD TO CART ]</button>
</div>`).join('');
let preview=document.getElementById('cartPreview');
if(cart.length===0){preview.innerHTML='empty';return}
preview.innerHTML = cart.map(c=>`
<div class="cart-item">
<span>${c.name.slice(0,12)}</span>
<span class="qty">
<button onclick="changeQty(${c.id},-1)">-</button> ${c.qty} <button onclick="changeQty(${c.id},1)">+</button>
<button onclick="changeQty(${c.id},-${c.qty})" style="color:var(--red);margin-left:4px">HAPUS</button>
</span>
</div>`).join('') + `<div style="margin-top:6px;font-weight:700">TOTAL: Rp ${cart.reduce((a,b)=>a+b.price*b.qty,0).toLocaleString('id-ID')}</div>`;
}
let texts=["> loading rainbow+transparent... [OK]","> colors 8/8 LOADED: GREEN RED PURPLE SILVER ORANGE YELLOW BLUE TRANS [100%]","> backup system: CART_KEY="+CART_KEY+" [SAFE]","> ghost glass effect: backdrop-filter blur [ON]","> WELCOME TO DAPORDERAPK RAINBOW STORE v4.1"];
let i=0; setInterval(()=>{document.getElementById('typeText').innerText=texts[i%texts.length]; i++},1800);
updateUI();
</script>
</body>
  </html>
