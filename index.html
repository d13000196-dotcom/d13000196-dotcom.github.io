<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DapOrderApk - Official Store</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#08080c;color:#fff;font-family:Poppins,sans-serif}
.top{text-align:center;padding:20px}.desc{max-width:820px;margin:0 auto 18px;text-align:center;opacity:.6;font-size:.88rem;padding:0 12px}
.video-layers-wrap{width:95%;max-width:1100px;margin:0 auto 22px;border-radius:22px;overflow:hidden;position:relative;height:400px;background:#000;border:1px solid rgba(255,0,64,.35);box-shadow:0 0 35px rgba(255,0,64,.25);transform:translateZ(0)}
.video-layers-wrap video{width:100%;height:100%;object-fit:cover;display:block;transform:translateZ(0);filter:none}
.ov{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.85),transparent 60%);pointer-events:none}
.label{position:absolute;left:18px;right:18px;bottom:16px;display:flex;justify-content:space-between;align-items:center}
.badge{padding:7px 14px;border-radius:20px;font-weight:800;font-size:.7rem}.red{background:#ff0040}.breathing{animation:breathe 2s infinite}
@keyframes breathe{0%,100%{box-shadow:0 0 10px #ff0040}50%{box-shadow:0 0 26px #ff0040}}
.products{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;padding:14px}
.card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:12px}
.card img{width:100%;height:150px;object-fit:cover;border-radius:10px}
.price{margin:8px 0;font-weight:800}.btn{width:100%;padding:10px;border:none;border-radius:10px;font-weight:800;cursor:pointer;margin-top:6px}
.btn-r{background:#ff0040;color:#fff}.btn-b{background:#00a6ff;color:#fff}
.uptab{display:none;margin-top:10px;background:rgba(255,238,0,.14);border:1px dashed #ffee00;padding:10px;border-radius:10px;font-size:.8rem}.uptab.show{display:block}
#floatCart{position:fixed;left:18px;top:68%;width:60px;height:60px;background:radial-gradient(#00c6ff,#7a00ff);border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:9999;cursor:grab;box-shadow:0 0 20px #00c6ff;font-size:26px}
#cart{position:fixed;right:-380px;top:0;width:360px;height:100vh;background:#12121a;z-index:9998;transition:.35s;padding:16px;border-left:1px solid #222;display:flex;flex-direction:column}
#cart.open{right:0}
</style></head><body>
<div class="top"><h1>DAPORDERAPK</h1><div style="opacity:.45;font-size:.7rem">INDEX • LAYERS SMOOTH</div></div>
<div class="desc">Toko APK Premium - Layers Video di bawah keterangan, di atas produk - Foto produk tidak diubah</div>
<div class="video-layers-wrap breathing">
<video autoplay muted loop playsinline preload="auto" src="darkverse-layers.mp4"></video>
<div class="ov"></div>
<div class="label"><div><div style="font-weight:800;letter-spacing:2px">DARKVERSE // LAYERS</div><div style="opacity:.7;font-size:.75rem">Smooth 60fps Anti Patah</div></div><span class="badge red">VIDEO ACTIVE</span></div>
</div>
<div class="products" id="prod"></div>
<div id="floatCart">🛒<span id="ccount" style="position:absolute;top:-4px;right:-4px;background:#ff0040;color:#fff;font-size:.65rem;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center">0</span></div>
<div id="cart"><h3>Keranjang</h3><div id="citems" style="flex:1;overflow:auto;margin:12px 0"></div><div id="ctotal" style="font-weight:800"></div>
<button class="btn btn-r breathing" style="margin-top:12px" onclick="goPay()">LANJUT KE PAYMENT →</button>
<button class="btn" style="background:#222;margin-top:8px" onclick="document.getElementById('cart').classList.remove('open')">Tutup</button></div>
<script>
const DATA=[
{app:'darkverse',name:'DarkVerse',photo:'https://picsum.photos/seed/darkv1/400/200',tiers:[{id:'dark-user',label:'FULL USER',price:50000},{id:'dark-reseller',label:'RESELLER',price:80000},{id:'dark-owner',label:'OWNER / PT',price:150000}]},
{app:'tr4svoid',name:'TR4SVLOID',photo:'https://picsum.photos/seed/tr4s/400/200',tiers:[{id:'tr-user',label:'USER',price:25000},{id:'tr-reseller',label:'RESELLER',price:45000}]},
{app:'xgtrash',name:'XG Trash',photo:'https://picsum.photos/seed/xg/400/200',tiers:[{id:'xg-user',label:'USER',price:20000},{id:'xg-reseller',label:'RESELLER',price:35000}]}
];
let owned=JSON.parse(localStorage.getItem('owned')||'["dark-user"]'); let cart=JSON.parse(localStorage.getItem('cart')||'[]');
function getOwned(app){let max=null; DATA.find(d=>d.app===app).tiers.forEach(t=>{if(owned.includes(t.id)) max=t;}); return max;}
function render(){
 let h=''; DATA.forEach(app=>{ app.tiers.forEach(t=>{
  const ot=getOwned(app.app); let up=null,show=false,txt='';
  if(ot && t.price>ot.price){up=t.price-ot.price;show=true;txt=`Up Role ${ot.label}→${t.label} cuma Rp ${up.toLocaleString('id-ID')}`;}
  h+=`<div class="card"><img src="${app.photo}" loading="lazy"><div style="font-weight:700;margin-top:8px">${app.name} - ${t.label}</div><div class="price">Rp ${t.price.toLocaleString('id-ID')}</div><button class="btn ${t.label.includes('RESELLER')?'btn-b':'btn-r'} breathing" onclick="add('${t.id}',${t.price},'${app.name} ${t.label}')">BELI</button><div class="uptab ${show?'show':''}"><b style="color:#ffee00">TAB UP ROLE</b><br>${txt}<br><button class="btn" style="background:#ffee00;color:#000;margin-top:6px" onclick="add('${t.id}',${up},'UP ROLE ${app.name} ${ot?ot.label:''}→${t.label}')">UP ROLE Rp ${up?up.toLocaleString('id-ID'):''}</button></div></div>`;
 });}); document.getElementById('prod').innerHTML=h;
}
function add(id,price,name){cart.push({id,price,name}); save(); document.getElementById('cart').classList.add('open');}
function save(){localStorage.setItem('cart',JSON.stringify(cart)); upd();}
function upd(){let total=0,html=''; cart.forEach((c,i)=>{total+=c.price; html+=`<div style="display:flex;justify-content:space-between;background:#1c1c28;margin:6px 0;padding:8px;border-radius:8px;font-size:.8rem"><span>${c.name}</span><span>Rp ${c.price.toLocaleString('id-ID')} <b style="cursor:pointer;color:#ff4d6d" onclick="rem(${i})">✕</b></span></div>`;}); document.getElementById('citems').innerHTML=html||'<div style="opacity:.5">Kosong</div>'; document.getElementById('ctotal').innerText='Total: Rp '+total.toLocaleString('id-ID'); document.getElementById('ccount').innerText=cart.length;}
function rem(i){cart.splice(i,1); save();}
function goPay(){if(cart.length===0) return alert('keranjang kosong'); save(); window.location.href='payment.html';}
render(); upd();
const fc=document.getElementById('floatCart'); let d=false,sx,sy,ix,iy;
fc.addEventListener('mousedown',e=>{d=true;sx=e.clientX;sy=e.clientY;ix=fc.offsetLeft;iy=fc.offsetTop;});
window.addEventListener('mousemove',e=>{if(!d)return;fc.style.left=(ix+e.clientX-sx)+'px';fc.style.top=(iy+e.clientY-sy)+'px';});
window.addEventListener('mouseup',()=>d=false);
fc.addEventListener('click',()=>document.getElementById('cart').classList.toggle('open'));
</script></body></html>
