<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin DapOrderApk</title><style>body{background:#f6f6f7;font-family:sans-serif;padding:16px} .box{background:#fff;padding:18px;border-radius:16px;max-width:500px;margin:auto} input{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:10px} button{width:100%;padding:12px;background:#111;color:#fff;border:none;border-radius:10px;font-weight:800;margin-top:8px;cursor:pointer} .list{margin-top:16px} .item{border:1px solid #eee;padding:10px;border-radius:10px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center} .del{color:#ff3b30;font-weight:800;cursor:pointer}</style></head><body><div class="box"><h2>Admin DapOrderApk</h2><p style="font-size:12px;opacity:.6">Tambah produk + gambar</p><input id="name" placeholder="Nama Produk"><input id="price" type="number" placeholder="Harga (contoh 50000)"><input id="img" placeholder="Link Gambar (https://...)"><input id="cat" placeholder="Kategori: DarkVerse / TR4SVLOID / X-GTR4SH"><button onclick="add()">+ TAMBAH PRODUK</button><div class="list" id="list"></div><a href="index.html" style="display:block;text-align:center;margin-top:14px;font-size:12px">← Lihat Toko</a></div><script>let custom=JSON.parse(localStorage.getItem('daporder_custom')||'[]');function render(){document.getElementById('list').innerHTML=custom.map(p=>`<div class="item"><div><b>${p.name}</b><br><small>Rp ${p.price.toLocaleString('id-ID')} • ${p.cat}</small></div><div class="del" onclick="del(${p.id})">HAPUS</div></div>`).join('')||'<small>Belum ada produk custom</small>';}function add(){let n=document.getElementById('name').value,pr=parseInt(document.getElementById('price').value),im=document.getElementById('img').value,ca=document.getElementById('cat').value||'DarkVerse';if(!n||!pr)return alert('Isi nama & harga wok!');custom.push({id:Date.now(),name:n,price:pr,img:im,cat:ca});localStorage.setItem('daporder_custom',JSON.stringify(custom));document.getElementById('name').value='';document.getElementById('price').value='';document.getElementById('img').value='';render();alert('Sukses wok! Cek index.html');}function del(id){custom=custom.filter(x=>x.id!==id);localStorage.setItem('daporder_custom',JSON.stringify(custom));render();}render();</script></body></html>
