<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment - DapOrderApk</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@800&display=swap" rel="stylesheet">
<style>
:root{--neon:#00ff88;--border:#00ff88;--panel:#101410;--bg:#050805;--text:#c8ffd8}
body{margin:0;background:#050805;color:#c8ffd8;font-family:'JetBrains Mono';background-image:linear-gradient(var(--border) 1px, transparent 1px),linear-gradient(90deg, var(--border) 1px, transparent 1px);background-size:35px 35px}
.container{max-width:480px;margin:0 auto;border-left:3px solid var(--border);border-right:3px solid var(--border);background:var(--bg);min-height:100vh;padding:10px}
.box{border:3px solid var(--border);background:var(--panel);padding:10px;margin-bottom:10px}
.title{font-family:'Press Start 2P';font-size:10px;color:var(--neon);margin-bottom:10px}
.item{display:flex;justify-content:space-between;align-items:center;border:2px solid var(--border);padding:8px;margin:6px 0;background:#000}
.cname{font-family:'Press Start 2P';font-size:6px;line-height:1.3;max-width:160px}
.sbtn{border:2px solid var(--neon);background:#000;color:var(--neon);font-family:'Press Start 2P';font-size:9px;width:28px;height:28px;cursor:pointer}
.dbtn{border:2px solid #ff3344;background:#000;color:#ff3344;font-family:'Press Start 2P';font-size:6px;padding:5px;cursor:pointer}
.btn{width:100%;background:var(--neon);color:#000;border:3px solid #000;padding:12px;font-family:'Press Start 2P';font-size:8px;cursor:pointer;margin-top:6px;box-shadow:4px 4px 0 #000}
.btn2{width:100%;background:#000;color:var(--neon);border:2px solid var(--neon);padding:10px;font-family:'Press Start 2P';font-size:7px;cursor:pointer;margin-top:8px}
.qris{width:100%;border:3px solid var(--border);background:#fff;padding:10px;text-align:center}
.qris img{width:100%;max-width:300px}
</style>
</head>
<body>
<div class="container">
<div class="box">
<div style="display:flex;justify-content:space-between"><div class="title">CHECKOUT</div><a href="index.html" style="font-family:'Press Start 2P';font-size:7px;color:var(--neon);text-decoration:none">[X] KEMBALI</a></div>
<div id="list"></div>
<div style="border-top:3px solid var(--border);margin-top:10px;padding-top:10px;font-family:'Press Start 2P';font-size:9px">TOTAL BAYAR: Rp <span id="total">0</span></div>
<button class="btn2" onclick="clearAll()">[ KOSONGKAN KERANJANG ]</button>
</div>

<div class="box">
<div class="title">METODE BAYAR</div>
<div style="font-family:'Press Start 2P';font-size:7px;line-height:1.8">
DANA: 082312728245<br>
A/N: DAFF<br><br>
QRIS: DAFF SHOP<br>
NMID: ID1025450705674<br>
SATU QRIS UNTUK SEMUA
</div>
<div class="qris" style="margin-top:10px"><img src="qris.jpg" onerror="this.src='https://placehold.co/300x300/fff/000?text=QRIS+DAFF+SHOP'"></div>
</div>

<div class="box">
<div class="title">KONFIRMASI WA</div>
<input id="nama" placeholder="Nama lu wok" style="width:100%;background:#000;border:2px solid var(--border);color:var(--neon);padding:10px;font-family:'Press Start 2P';font-size:7px;margin-bottom:6px">
<button class="btn" onclick="sendWA()">KIRIM BUKTI KE WA 083879195047 →</button>
<div style="font-family:'Press Start 2P';font-size:6px;margin-top:8px;color:#fff;line-height:1.5">TRUSTED 700+ PEMBELI ● AUTO PROCESS</div>
</div>
</div>

<script>
const products=[
{name:"DarkVerse FULL UPDATE",price:50000},{name:"DarkVerse RESELLER",price:80000},{name:"DarkVerse PARTNER",price:150000},
{name:"TR4SVLOID 1 MINGGU",price:10000},{name:"TR4SVLOID 1 BULAN",price:15000},{name:"TR4SVLOID FULL UPDATE",price:25000},
{name:"TR4SVLOID RESELLER",price:55000},{name:"TR4SVLOID VIP 1 BULAN",price:30000},{name:"TR4SVLOID VIP PERMANEN",price:50000},
{name:"TR4SVLOID PARTNER",price:65000},{name:"X-GTR4SH FULL UPDATE",price:20000},{name:"X-GTR4SH RESELLER",price:30000},
{name:"X-GTR4SH ADMIN",price:50000},{name:"X-GTR4SH PARTNER",price:70000},{name:"X-GTR4SH MODERATOR",price:100000},
];
let cart=JSON.parse(localStorage.getItem('dap_cart')||'[]');
function save(){localStorage.setItem('dap_cart',JSON.stringify(cart)); render()}
function add(i){let f=cart.find(c=>c.idx==i); if(f) f.qty++; else cart.push({idx:i,qty:1}); save()}
function dec(i){let f=cart.find(c=>c.idx==i); if(!f) return; f.qty--; if(f.qty<=0) cart=cart.filter(c=>c.idx!=i); save()}
function rem(i){cart=cart.filter(c=>c.idx!=i); save()}
function clearAll(){if(confirm('Yakin kosongkan keranjang?')){cart=[]; save()}}
function render(){
let list=document.getElementById('list'); list.innerHTML=''; let tot=0;
if(cart.length==0){list.innerHTML='<div style="font-family:Press Start 2P;font-size:7px;text-align:center;padding:20px">KERANJANG KOSONG<br><a href=index.html style=color:var(--neon)>BALIK BELANJA</a></div>'; document.getElementById('total').innerText='0'; return;}
cart.forEach(c=>{
let p=products[c.idx]; tot+=p.price*c.qty;
list.innerHTML+=`<div class="item"><div class="cname">${p.name}<br><span style="color:var(--neon)">Rp ${p.price.toLocaleString('id-ID')} x ${c.qty}</span></div><div style="display:flex;gap:4px;align-items:center"><button class="sbtn" onclick="dec(${c.idx})">-</button><span style="font-family:Press Start 2P;font-size:8px">${c.qty}</span><button class="sbtn" onclick="add(${c.idx})">+</button><button class="dbtn" onclick="rem(${c.idx})">HAPUS</button></div></div>`;
});
document.getElementById('total').innerText=tot.toLocaleString('id-ID');
}
function sendWA(){
let nama=document.getElementById('nama').value||'Customer';
if(cart.length==0){alert('Keranjang kosong wok!');return;}
let tot=0; let txt=`Halo Admin DapOrderApk! Mau order nih%0A%0ANama: ${nama}%0A%0APesanan:%0A`;
cart.forEach(c=>{let p=products[c.idx]; tot+=p.price*c.qty; txt+=`- ${p.name} x${c.qty} = Rp ${p.price*c.qty}%0A`;});
txt+=`%0ATotal: Rp ${tot}%0A%0ASudah transfer ke DANA 082312728245 / QRIS DAFF SHOP%0AMinta bukti ya!`;
window.open(`https://wa.me/6283879195047?text=${txt}`,'_blank');
}
render();
</script>
</body>
</html>
