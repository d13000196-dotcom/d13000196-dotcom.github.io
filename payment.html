<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bayar - DapOrderApk</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@700;800&family=Inter:wght@600&display=swap" rel="stylesheet">
<style>
:root{--primary:#00bfa6}
*{box-sizing:border-box;font-family:'Inter',Arial}body{background:#f5f5f7;margin:0;padding:12px}
.angka{font-family:'Roboto Condensed',sans-serif!important}
.box{background:#fff;padding:20px;border-radius:20px;max-width:430px;margin:auto}
.qris-box{background:#111;border-radius:16px;padding:14px;text-align:center;border:2px solid var(--primary)}
.qris-box img{width:100%;max-width:280px;border-radius:12px;background:#fff}
.order-item{font-size:13px;border-bottom:1px solid #eee;padding:8px 0;display:flex;justify-content:space-between}
input,select,textarea{width:100%;padding:12px;margin:6px 0 10px 0;border:1px solid #ddd;border-radius:10px}
.btn{width:100%;padding:14px;background:var(--primary);color:#fff;border:none;border-radius:12px;font-weight:900;font-size:15px;cursor:pointer}
.salin-box{background:#f0fdfa;border:1px dashed var(--primary);padding:10px;border-radius:10px;display:flex;justify-content:space-between;align-items:center;margin:10px 0}
</style>
</head>
<body>
<div class="box">
<h2 style="margin:0">DapOrder<span style="color:var(--primary)">Apk</span> - Bayar</h2>
<div id="orderList" style="margin:10px 0;background:#f9f9f9;padding:10px;border-radius:10px"></div>
<div id="totalBayar" class="angka" style="font-weight:900;color:var(--primary);font-size:22px;margin-bottom:12px">Total: Rp 0</div>
<div class="qris-box"><div style="color:var(--primary);font-size:11px;letter-spacing:2px;margin-bottom:8px">QRIS PAYMENT • DapOrderApk</div><img src="https://placehold.co/400x400/111111/00bfa6?text=QRIS+DapOrderApk" id="qrisImg"><div style="color:#fff;margin-top:10px;font-size:12px">Scan to Pay - Support GoPay OVO DANA</div></div>
<div class="salin-box"><div><div style="font-size:11px;color:#666">DANA / GoPay</div><b id="noDana" class="angka" style="font-size:16px">081234567890</b></div><button onclick="salinDana()" style="background:#000;color:#fff;border:none;padding:8px 12px;border-radius:8px;font-size:11px;cursor:pointer">SALIN</button></div>
<input type="text" id="nama" placeholder="Nama Lengkap"><input type="text" id="wa" placeholder="No WA Aktif"><textarea id="catatan" placeholder="Catatan / ID Game"></textarea><select id="metode"><option>DANA</option><option>GoPay</option><option>OVO</option><option>QRIS</option><option>Transfer Bank</option></select>
<button class="btn" onclick="bayar()">KIRIM BUKTI & ORDER KE WA →</button><button onclick="location.href='index.html'" style="width:100%;padding:12px;background:#eee;border:none;border-radius:10px;margin-top:10px;cursor:pointer">Kembali</button><p id="salinMsg" style="text-align:center;color:var(--primary);font-size:12px;display:none;margin-top:10px">✅ Nomor disalin!</p>
</div>
<script>
let theme=localStorage.getItem('dap_theme')||'original';let color='#00bfa6';if(theme==='biru')color='#0d6efd';if(theme==='merah')color='#e11d48';document.documentElement.style.setProperty('--primary',color);
let cart=JSON.parse(localStorage.getItem('dap_cart')||'[]');let products=JSON.parse(localStorage.getItem('dap_products')||'[]');let total=0;let listHTML='';cart.forEach(c=>{let p=products[c.idx];let sub=p.price*c.qty;total+=sub;listHTML+=`<div class="order-item"><span>${p.name} <b class="angka">x${c.qty}</b></span><span class="angka">Rp ${sub.toLocaleString('id-ID')}</span></div>`;});document.getElementById('orderList').innerHTML=listHTML||'Keranjang kosong';document.getElementById('totalBayar').innerText='Total: Rp '+total.toLocaleString('id-ID')+'';
function salinDana(){navigator.clipboard.writeText(document.getElementById('noDana').innerText);document.getElementById('salinMsg').style.display='block';setTimeout(()=>{document.getElementById('salinMsg').style.display='none';},2000);}
function bayar(){let nama=document.getElementById('nama').value.trim();let wa=document.getElementById('wa').value.trim();let catatan=document.getElementById('catatan').value.trim();let metode=document.getElementById('metode').value;if(!nama||!wa){alert('Isi Nama & WA dulu wok!');return;}let pesan=`Halo DapOrderApk saya mau bayar:%0A%0A${cart.map(c=>{let p=products[c.idx];return `- ${p.name} x${c.qty} = Rp ${(p.price*c.qty).toLocaleString('id-ID')}`}).join('%0A')}%0A%0A*Total: Rp ${total.toLocaleString('id-ID')}*%0ANama: ${nama}%0AWA: ${wa}%0ACatatan: ${catatan}%0AMetode: ${metode}`;let noToko="6281234567890";localStorage.removeItem('dap_cart');window.open(`https://wa.me/${noToko}?text=${pesan}`,'_blank');setTimeout(()=>{alert('✅ Order terkirim! Keranjang auto kehapus.');location.href='index.html';},1000);}
</script>
</body>
</html>
