<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>DAP ORDER APK PAYMENT iOS</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{background:#07070b;color:#fff;font-family:Poppins,sans-serif}.top{text-align:center;padding:22px 14px 6px}.top h1{font-size:1.8rem;font-weight:800}.top p{opacity:.5;letter-spacing:3px;font-size:.78rem}.wrap{max-width:1100px;margin:0 auto;padding:12px;display:grid;grid-template-columns:1fr;gap:14px}@media(min-width:800px){.wrap{grid-template-columns:1.1fr.9fr}}.box{background:#12121a;border:1px solid #1e1e2a;border-radius:18px;padding:16px}.item{background:#1a1a26;padding:12px;border-radius:10px;margin:8px 0;display:flex;justify-content:space-between;font-size:.85rem}.total{font-size:1.25rem;font-weight:800;text-align:center;margin:12px 0}.opt{display:flex;gap:8px;margin:12px 0}.opt button{flex:1;padding:12px;border-radius:10px;border:1px solid #333;background:#1a1a26;color:#fff;font-weight:700}.opt button.active{border-color:#00c6ff;background:#00c6ff22;color:#00c6ff}.qris-box{background:#fff;border-radius:16px;padding:12px;text-align:center}.qris-box img{width:100%;max-width:360px;border-radius:10px;display:block;margin:0 auto}.btn{width:100%;padding:13px;border:none;border-radius:12px;font-weight:800;cursor:pointer;margin-top:10px}.btn-r{background:#ff0a32;color:#fff}.btn-g{background:#1e1e2e;color:#fff}.small{opacity:.55;font-size:.72rem;text-align:center;margin-top:8px}video.bg{width:100%;height:220px;object-fit:cover;border-radius:14px;margin-bottom:12px}</style></head><body><div class="top"><h1>DAP ORDER APK</h1><p>OFFICIAL SHOP • iOS + ANDROID</p></div><div class="wrap"><div class="box"><video class="bg" autoplay loop muted playsinline webkit-playsinline x5-playsinline src="darkverse-layers.mp4" poster="darkverse-layers.jpg"></video><h3>Ringkasan</h3><div id="list"></div><div class="total" id="total">Total: Rp 0</div></div><div class="box"><h3 style="text-align:center">PAYMENT iOS FIX</h3><div class="opt"><button id="bd" class="active" onclick="setP('DANA')">DANA</button><button id="bq" onclick="setP('QRIS')">QRIS</button></div><div class="qris-box"><img id="qrImg" src="qris.png" onerror="this.onerror=null;this.src='https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=QRIS'"><div style="color:#000;font-weight:700;margin-top:8px" id="payLabel">QRIS</div></div><div class="small" id="info"></div><button class="btn btn-r" onclick="bayar()">BAYAR VIA WA</button><button class="btn btn-g" onclick="location.href='index.html'">← Kembali</button></div></div><script>let cart=JSON.parse(localStorage.getItem('cart')||'[]');let pay=localStorage.getItem('pay')||'DANA';function render(){let tot=0,h='';cart.forEach(c=>{tot+=c.price;h+=`<div class="item"><span>${c.name}</span><span>Rp ${c.price.toLocaleString('id-ID')}</span></div>`;});document.getElementById('list').innerHTML=h||'Kosong';document.getElementById('total').innerText='Total: Rp '+tot.toLocaleString('id-ID');if(pay==='QRIS'){document.getElementById('qrImg').src='qris.png';document.getElementById('info').innerText=`QRIS Scan Rp ${tot.toLocaleString('id-ID')}`;}else{document.getElementById('qrImg').src='https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=DANA-'+tot;document.getElementById('info').innerText=`DANA Rp ${tot.toLocaleString('id-ID')}`;}document.getElementById('bd').classList.toggle('active',pay==='DANA');document.getElementById('bq').classList.toggle('active',pay==='QRIS');}function setP(p){pay=p;localStorage.setItem('pay',p);render();}function bayar(){if(cart.length===0)return alert('kosong');let tot=cart.reduce((a,b)=>a+b.price,0);let m=`Halo DAP ORDER APK%0A`;cart.forEach(c=>m+=`- ${c.name} Rp ${c.price}%0A`);m+=`Total ${tot} ${pay}`;window.open('https://wa.me/6281234567890?text='+m,'_blank');let o=JSON.parse(localStorage.getItem('owned')||'[]');cart.forEach(c=>{if(!o.includes(c.id))o.push(c.id);});localStorage.setItem('owned',JSON.stringify(o));localStorage.setItem('cart','[]');cart=[];render();}render();</script></body></html>
