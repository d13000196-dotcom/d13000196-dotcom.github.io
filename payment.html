<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Payment - DapOrderApk</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#08080c;color:#fff;font-family:Poppins,sans-serif;display:flex;justify-content:center;padding:20px}
.box{width:100%;max-width:420px;background:#12121a;border:1px solid #222;border-radius:20px;padding:20px}
h2{text-align:center}.qris{width:100%;border-radius:14px;margin:14px 0;background:#fff;padding:8px}
.item{background:#1c1c28;padding:10px;border-radius:10px;margin:6px 0;display:flex;justify-content:space-between;font-size:.85rem}
.total{font-weight:800;font-size:1.2rem;text-align:center;margin:12px 0}
.pay-opt{display:flex;gap:8px;margin:10px 0}.pay-opt button{flex:1;padding:10px;border-radius:10px;border:1px solid #333;background:#1e1e2a;color:#fff;cursor:pointer}
.pay-opt button.active{border-color:#00c6ff;background:#00c6ff22;color:#00c6ff}
.btn{width:100%;padding:12px;border:none;border-radius:12px;font-weight:800;cursor:pointer;margin-top:8px}
.btn-r{background:#ff0040;color:#fff}.btn-b{background:#222;color:#fff}
.breathing{animation:breathe 2s infinite}@keyframes breathe{0%,100%{box-shadow:0 0 10px #ff0040}50%{box-shadow:0 0 22px #ff0040}}
</style></head><body>
<div class="box">
<h2>PAYMENT NEW FIX</h2><div style="text-align:center;opacity:.5;font-size:.7rem">All Jalan • 1x Bayar • DANA/QRIS</div>
<div id="items"></div>
<div class="total" id="total">Total: Rp 0</div>
<div class="pay-opt"><button id="bDANA" class="active" onclick="setPay('DANA')">DANA</button><button id="bQRIS" onclick="setPay('QRIS')">QRIS</button></div>
<img id="qr" class="qris" src="">
<div id="info" style="font-size:.75rem;opacity:.6;text-align:center"></div>
<button class="btn btn-r breathing" onclick="checkout()">🚀 BAYAR VIA WA</button>
<button class="btn btn-b" onclick="window.location.href='index.html'">← Kembali ke Toko</button>
<button class="btn btn-b" style="font-size:.7rem;opacity:.6" onclick="clearC()">Kosongkan Keranjang</button>
</div>
<script>
let cart=JSON.parse(localStorage.getItem('cart')||'[]'); let pay=localStorage.getItem('pay')||'DANA';
function render(){
 let total=0,html=''; cart.forEach(c=>{total+=c.price; html+=`<div class="item"><span>${c.name}</span><span>Rp ${c.price.toLocaleString('id-ID')}</span></div>`;});
 document.getElementById('items').innerHTML=html||'<div style="opacity:.5;text-align:center">Keranjang kosong</div>';
 document.getElementById('total').innerText='Total Bayar All Jalan: Rp '+total.toLocaleString('id-ID');
 document.getElementById('qr').src='https://api.qrserver.com/v1/create-qr-code/?size=500x500&data=DAPORDER-PAY-'+pay+'-TOTAL-'+total+'-'+Date.now();
 document.getElementById('info').innerText=pay==='DANA'?'DANA: 0821-xxxx-xxxx • Transfer sesuai total Rp '+total.toLocaleString('id-ID'):'QRIS: Scan QR di atas • Auto nominal Rp '+total.toLocaleString('id-ID');
 document.getElementById('bDANA').classList.toggle('active',pay==='DANA'); document.getElementById('bQRIS').classList.toggle('active',pay==='QRIS');
}
function setPay(p){pay=p; localStorage.setItem('pay',p); render();}
function checkout(){
 if(cart.length===0) return alert('keranjang kosong');
 let total=cart.reduce((a,b)=>a+b.price,0);
 let msg=`Halo DapOrderApk%0AOrder Payment New Fix:%0A`; cart.forEach(c=>msg+=`- ${c.name} Rp ${c.price.toLocaleString('id-ID')}%0A`);
 msg+=`%0ATotal: Rp ${total.toLocaleString('id-ID')}%0AMetode: ${pay}%0A%0ASudah transfer!`;
 window.open('https://wa.me/6281234567890?text='+msg,'_blank');
 let owned=JSON.parse(localStorage.getItem('owned')||'[]'); cart.forEach(c=>{if(!owned.includes(c.id)) owned.push(c.id);});
 localStorage.setItem('owned',JSON.stringify(owned)); clearC();
}
function clearC(){cart=[]; localStorage.setItem('cart','[]'); render();}
render();
</script></body></html>
