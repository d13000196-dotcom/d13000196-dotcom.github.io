<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DAP PAYMENT - OFFICIAL PAYMENT</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
body{background:#070710;color:#fff;padding:14px}
.qris-box{background:#fff;color:#000;border-radius:20px;padding:16px;text-align:center}
.qris-box img{width:100%;max-width:300px;margin:10px auto;display:block}
.info{background:#15151e;border-radius:16px;padding:12px;margin-top:12px;text-align:center;font-size:13px;border:1px solid #222}
.btn-upload{width:100%;padding:14px;border:2px dashed #00ffa6;border-radius:14px;background:transparent;color:#fff;margin-top:14px;font-weight:700}
.inp-nama{width:100%;padding:14px;border-radius:14px;background:#15151e;border:1px solid #333;color:#fff;margin-top:12px}
.btn-wa{width:100%;padding:16px;border-radius:14px;border:0;background:#00ff88;color:#000;font-weight:900;margin-top:14px;font-size:15px}
</style>
</head>
<body>

<div class="qris-box">
<b>DAFF SHOP</b><br>
<small>NMID : ID1025450705674<br>A01</small>
<img src="qris.jpg">
<small>SATU QRIS UNTUK SEMUA</small>
</div>

<div class="info">
<b id="produkText">DAFF SHOP</b><br>
<span style="font-size:11px;color:#aaa">TAP QRIS DOWNLOAD - ATAU SS QRIS DI ATAS</span><br><br>
<span style="background:#000;color:#00ff88;padding:6px 10px;border-radius:8px;font-size:12px;display:inline-block">
DANA : 082312728245<br>GoPay / OVO / QRIS All Pay
</span>
</div>

<label style="display:block;margin-top:16px;font-size:12px;color:#aaa;margin-left:4px">UPLOAD FOTO BUKTI TRANSFER DISINI</label>
<input type="file" id="bukti" accept="image/*" class="btn-upload">

<label style="display:block;margin-top:12px;font-size:12px;color:#aaa;margin-left:4px">Nama Mu (Nama Pembeli)</label>
<input type="text" id="namaMu" class="inp-nama" placeholder="Tulis nama kamu disini...">

<button class="btn-wa" onclick="konfirmasi()">KONFIRMASI PEMBAYARAN KE WHATSAPP</button>

<script>
const WA="6283879195047"; // GANTI NOMOR LU
// ambil produk dari URL
const urlParams = new URLSearchParams(window.location.search);
const produk = urlParams.get('produk') || 'Produk DAFF SHOP';
document.getElementById('produkText').innerText = produk;

function konfirmasi(){
 let nama = document.getElementById('namaMu').value.trim();
 let file = document.getElementById('bukti').files[0];
 if(!file) return alert('Upload bukti transfer dulu!');
 if(!nama) return alert('Isi Nama Mu dulu!');

 // Simpan ke dashboard (localStorage)
 let reader = new FileReader();
 reader.onload = e => {
   let data = {id:Date.now(),tgl:new Date().toLocaleString('id-ID'),produk:produk,nama:nama,img:e.target.result};
   let arr = JSON.parse(localStorage.getItem('bukti')||"[]");
   arr.unshift(data);
   localStorage.setItem('bukti',JSON.stringify(arr));

   let teks = `Halo bang, konfirmasi TF%0A%0AProduk yang di beli: ${produk}%0ANama Pembeli: ${nama}%0A%0ACek bang sudah masuk belum, itu bukti tf nya cek di website.`;
   window.open(`https://wa.me/${WA}?text=${teks}`,'_blank');
 };
 reader.readAsDataURL(file);
}
</script>
</body>
</html>
