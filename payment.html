<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>DAP - PAYMENT</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#07070b;color:#fff;font-family:Poppins,sans-serif;padding:16px}.top{text-align:center;padding:14px}.top h1{font-size:1.6rem;font-weight:800;color:#00ff88}.box{max-width:650px;margin:0 auto;background:#12121a;border:1px solid #1e1e2a;border-radius:16px;padding:16px}.method{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}.m{border:1px solid #333;border-radius:12px;padding:10px;text-align:center;cursor:pointer;background:#1a1a26}.m.active{border-color:#00ff88}.m img{width:50px;height:36px;object-fit:contain;background:#fff;border-radius:6px;padding:4px;margin:0 auto 6px;display:block}.total{font-size:1.3rem;font-weight:800;color:#00ff88;text-align:center;margin:12px 0}.btn{width:100%;padding:14px;border:none;border-radius:12px;font-weight:800;cursor:pointer}.btn-r{background:#00ff88;color:#000}.order{background:#0f0f17;border-radius:12px;padding:12px;margin:10px 0}.qris-box{background:#fff;border-radius:14px;padding:14px;text-align:center;margin:14px 0;cursor:pointer;border:3px solid #00ff88}.qris-box img{width:100%;max-width:320px;border-radius:8px}.dana-box{background:#1a1a26;padding:14px;border-radius:12px;text-align:center;border:1px solid #00ff8844;margin:12px 0}.upload{border:2px dashed #333;border-radius:12px;padding:16px;text-align:center;margin:14px 0;background:#0f0f17;cursor:pointer}.upload input{display:none}.preview{width:100%;max-height:300px;object-fit:contain;border-radius:10px;margin-top:10px;display:none}
</style></head><body>
<div class="top"><h1>DAP - PAYMENT</h1><p style="font-size:.7rem;opacity:.5">Official Payment | DANA: 082312728245 ATAS NAMA: MIY***N</p></div>
<div class="box">
<div id="order" class="order"></div>
<div class="total" id="tot"></div>
<div class="method">
<div class="m active" id="m-qris" onclick="setM('qris')"><img src="qris.png"><div>QRIS</div></div>
<div class="m" id="m-dana" onclick="setM('dana')"><img src="dana.png"><div>DANA</div></div>
<div class="m" id="m-ovo" onclick="setM('ovo')"><img src="ovo.png"><div>OVO</div></div>
<div class="m" id="m-gopay" onclick="setM('gopay')"><img src="gojek.png"><div>GOPAY</div></div>
</div>
<div class="qris-box" id="qrisBox" onclick="downloadQRIS()">
<img id="qrisImg" src="qris-payment.png" onerror="this.src='qris.png'" alt="QRIS">
<div style="font-weight:800;color:#000;margin-top:8px">👆 TAP UNTUK AUTO DOWNLOAD</div>
</div>
<div class="dana-box">
<div style="font-size:.75rem;opacity:.7">Transfer Manual:</div>
<div style="font-weight:800;font-size:1.5rem;color:#00ff88">082312728245</div>
<div style="font-weight:800;font-size:1.1rem">ATAS NAMA: MIY***N</div>
</div>
<div class="upload" onclick="document.getElementById('fileBukti').click()">
<div style="font-size:2rem">📸</div><div style="font-weight:700">Upload Bukti TF</div>
<input type="file" id="fileBukti" accept="image/*" onchange="previewBukti(this)">
<img id="previewImg" class="preview">
</div>
<button class="btn btn-r" onclick="bayar()">KONFIRMASI → WA 6283879195047</button>
<button class="btn" style="margin-top:10px;background:#1e1e2e;color:#fff" onclick="location.href='index.html'">← KEMBALI KE SHOP</button>
</div>
<script>
let cart=JSON.parse(localStorage.getItem('cart')||'[]');function fmt(n){return 'Rp '+n.toLocaleString('id-ID');}
let tot=0,h='';cart.forEach(c=>{tot+=c.price*c.qty;h+=`<div style="display:flex;justify-content:space-between"><span>${c.name} x${c.qty}</span><span>${fmt(c.price*c.qty)}</span></div>`;});
document.getElementById('order').innerHTML=h||'Kosong';document.getElementById('tot').innerText='Total: '+fmt(tot);
let method='qris';function setM(m){method=m;document.querySelectorAll('.m').forEach(x=>x.classList.remove('active'));document.getElementById('m-'+m).classList.add('active');document.getElementById('qrisBox').style.display=m==='qris'?'block':'none';}
function downloadQRIS(){let a=document.createElement('a');a.href=document.getElementById('qrisImg').src;a.download='QRIS-DAP-PAYMENT.png';document.body.appendChild(a);a.click();document.body.removeChild(a);alert('✅ QRIS Disimpan!');}
function previewBukti(i){if(i.files[0]){let r=new FileReader();r.onload=e=>{let im=document.getElementById('previewImg');im.src=e.target.result;im.style.display='block';};r.readAsDataURL(i.files[0]);}}
function bayar(){window.open(`https://wa.me/6283879195047?text=Halo%20DAP%20PAYMENT%20Order%20${fmt(tot)}%20DANA%20082312728245%20ATAS%20NAMA%20MIY***N`,'_blank');}
setM('qris');
</script></body></html>
