<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PAYMENT - DapOrderApk</title>
<style>
:root{--green:#00ff88;--red:#ff0040;--purple:#a000ff;--silver:#c0c0c0;--orange:#ff8800;--yellow:#ffea00;--blue:#00d0ff;--bg:#0a0a0a}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Courier New',monospace}
body{background:var(--bg);color:#fff;padding:14px}
.header{border-bottom:2px solid var(--green);padding:10px;display:flex;justify-content:space-between;align-items:center;background:#111;margin:-14px -14px 14px}
.logo{color:var(--green);font-weight:900;font-size:16px}
.btn{border:1px solid var(--silver);padding:6px 12px;background:#000;color:var(--silver);cursor:pointer;text-decoration:none;font-size:12px}
.wrap{max-width:900px;margin:auto;display:grid;grid-template-columns:1fr 340px;gap:14px}
@media(max-width:800px){.wrap{grid-template-columns:1fr}}
.box{border:2px solid var(--silver);padding:14px;background:#111}
.box.green{border-color:var(--green)} .box.trans{border-color:rgba(255,255,255,0.35);background:linear-gradient(135deg,rgba(255,255,255,0.12),rgba(255,255,255,0.03));backdrop-filter:blur(12px)}
.item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #222}
.qty button{width:28px;height:28px;background:#000;border:1px solid #555;color:#fff;cursor:pointer}
.hapus{color:var(--red);border:1px solid var(--red);background:#000;padding:4px 8px;cursor:pointer;margin-left:6px;font-size:11px}
.total{font-size:18px;font-weight:900;margin-top:10px;color:var(--yellow)}
.qris{width:100%;border:2px dashed var(--green);padding:12px;text-align:center;margin-top:10px;background:#000}
.qris img{width:100%;max-width:260px;border-radius:8px;margin:8px 0}
input{width:100%;padding:10px;background:#000;border:1px solid #444;color:#fff;margin:6px 0}
.payBtn{width:100%;padding:12px;background:var(--green);color:#000;border:0;font-weight:900;cursor:pointer;margin-top:10px;font-size:15px}
</style>
</head>
<body>
<div class="header"><div class="logo">DapOrderApk // PAYMENT v4.2 FIX QRIS</div><a class="btn" href="index.html">← BACK TO SHOP</a></div>
<div class="wrap">
<div class="box green">
<h3 style="color:var(--green)">> CART DETAIL</h3>
<div id="cartList"></div>
<div class="total" id="total">TOTAL: Rp 0</div>
<button onclick="clearCart()" style="margin-top:10px;width:100%;border:1px solid var(--red);color:var(--red);background:#000;padding:8px;cursor:pointer">KOSONGKAN KERANJANG</button>
</div>
<div>
<div class="box trans">
<h3>> CHECKOUT</h3>
<input id="nama" placeholder="Nama penerima">
<input id="wa" placeholder="WA (08xx)">
<input id="alamat" placeholder="Alamat lengkap (opsional)">
<div class="qris">
<div style="font-size:12px;color:var(--green);font-weight:700">QRIS DAFF SHOP - SCAN DISINI</div>
<img id="qrisImg" src="qris.jpg" alt="QRIS" onerror="this.onerror=null;this.src='qris.png';if(this.src.includes('qris.png')){this.onerror=function(){this.style.display='none';document.getElementById('qrisFallback').style.display='block'}}">
<div id="qrisFallback" style="display:none;font-size:40px">◫<br><span style="font-size:10px;color:#888">qris.jpg tidak ditemukan!<br>Upload qris.jpg ke repo</span></div>
<div style="font-size:11px">Scan untuk bayar<br><b style="color:var(--yellow);font-size:14px" id="payAmount">Rp 0</b></div>
</div>
<button class="payBtn" onclick="checkout()">[ CONFIRM PAYMENT ]</button>
<div id="status" style="font-size:11px;margin-top:8px;color:var(--blue)"></div>
</div>
</div>
</div>
<script>
const CART_KEY='daporder_cart';let cart=JSON.parse(localStorage.getItem(CART_KEY)||'[]');
function save(){localStorage.setItem(CART_KEY,JSON.stringify(cart));render();}
function changeQty(id,d){let f=cart.find(x=>x.id===id);if(!f)return;f.qty+=d;if(f.qty<=0)cart=cart.filter(x=>x.id!==id);save();}
function clearCart(){cart=[];save();}
function render(){let list=document.getElementById('cartList');if(cart.length===0){list.innerHTML='<div style="padding:20px;text-align:center;color:#666">KERANJANG KOSONG</div>';document.getElementById('total').innerText='TOTAL: Rp 0';document.getElementById('payAmount').innerText='Rp 0';return;}let total=0;list.innerHTML=cart.map(c=>{total+=c.price*c.qty;return `<div class="item"><div><b style="color:var(--${c.color==='trans'?'silver':c.color})">${c.name}</b><br><span style="font-size:11px">Rp ${c.price.toLocaleString('id-ID')}</span></div><div class="qty"><button onclick="changeQty(${c.id},-1)">-</button> ${c.qty} <button onclick="changeQty(${c.id},1)">+</button> <button class="hapus" onclick="changeQty(${c.id},-${c.qty})">HAPUS</button></div></div>`}).join('');document.getElementById('total').innerText='TOTAL: Rp '+total.toLocaleString('id-ID');document.getElementById('payAmount').innerText='Rp '+total.toLocaleString('id-ID');}
function checkout(){let nama=document.getElementById('nama').value;let wa=document.getElementById('wa').value;if(!nama||!wa){document.getElementById('status').innerText='> ERROR: isi nama & WA dulu!';return;}let total=cart.reduce((a,b)=>a+b.price*b.qty,0);let pesan=`Halo Daff Shop, saya mau order:%0A${cart.map(c=>`- ${c.name} x${c.qty}`).join('%0A')}%0ATotal: Rp ${total.toLocaleString('id-ID')}%0ANama: ${nama}%0AWA: ${wa}`;window.open(`https://wa.me/6283878195047?text=${pesan}`,'_blank');}
render();
</script>
</body>
</html>
