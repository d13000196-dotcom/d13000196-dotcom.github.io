<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>DAP - PAYMENT</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}body{background:#0a0a0a;color:#fff}.header{text-align:center;padding:25px;background:#000;border-bottom:2px solid #00ff88}.header h1{color:#00ff88}.box{max-width:500px;margin:20px auto;background:#161616;border:1px solid #222;border-radius:12px;padding:20px}.timer-box{text-align:center;background:#1f1f1f;padding:12px;border-radius:8px;border:1px dashed #ffaa00;margin-bottom:12px}#timer{font-size:28px}.metode{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:15px 0}.metode button{padding:12px;border-radius:8px;border:1px solid #333;background:#1f1f1f;color:#fff;font-weight:bold;cursor:pointer}.metode button.active{background:#00ff88;color:#000}.qris-box img{width:100%;max-width:300px;border-radius:10px;border:2px solid #00ff88;cursor:pointer}.dana-num{font-size:28px;color:#00ff88;font-weight:bold;text-align:center;margin:10px 0}.dana-name{text-align:center}.btn{width:100%;padding:13px;border-radius:8px;border:none;font-weight:bold;margin-top:10px;cursor:pointer}.btn-wa{background:#25D366;color:#fff}.btn-balik{background:#222;color:#fff;border:1px solid #333!important}#preview{width:100%;max-width:300px;display:none;margin:10px auto;border-radius:8px}</style></head>
<body><div class="header"><h1>DAP - PAYMENT</h1></div><div class="box"><div class="timer-box"><span style="color:#ffaa00;font-size:12px">BATAS WAKTU PEMBAYARAN</span><br><b id="timer">15:00</b></div><div id="total" style="text-align:center;color:#00ff88;font-weight:bold;font-size:20px">Total: Rp 0</div><div class="metode"><button onclick="pilih('qris')" id="b-qris" class="active">QRIS</button><button onclick="pilih('dana')" id="b-dana">DANA</button><button onclick="pilih('ovo')" id="b-ovo">OVO</button><button onclick="pilih('gopay')" id="b-gopay">GOPAY</button></div><div id="qris-box" style="text-align:center"><img id="qris-img" src="qris.png" onerror="this.src='https://via.placeholder.com/300x300/111/00ff88?text=QRIS'" onclick="downloadQRIS()"><p style="font-size:11px;color:#aaa;margin-top:8px">TAP QRIS AUTO DOWNLOAD</p></div><div id="dana-box" style="display:none;text-align:center"><div class="dana-num">082312728245</div><div>ATAS NAMA: <b>MIY***N</b></div></div><div style="margin-top:20px"><label>Upload Bukti TF:</label><input type="file" id="bukti" accept="image/*" style="width:100%;margin-top:8px"><img id="preview"></div><button class="btn btn-wa" onclick="keWA()">KONFIRMASI WA 6283879195047</button><button class="btn btn-balik" onclick="location.href='index.html'">KEMBALI KE SHOP</button></div>
<script>
let total=localStorage.getItem('dap_total')||0;document.getElementById('total').innerText='Total: Rp '+parseInt(total).toLocaleString();
function pilih(m){document.querySelectorAll('.metode button').forEach(b=>b.classList.remove('active'));document.getElementById('b-'+m).classList.add('active');document.getElementById('qris-box').style.display=m==='qris'?'block':'none';document.getElementById('dana-box').style.display=m!=='qris'?'block':'none';if(m!=='qris'){document.getElementById('dana-box').innerHTML=`<p>TRANSFER ${m.toUpperCase()}</p><div class="dana-num">082312728245</div><div>ATAS NAMA: <b>MIY***N</b></div>`;}}
function downloadQRIS(){let img=document.getElementById('qris-img');let a=document.createElement('a');a.href=img.src;a.download='qris-payment.png';a.click();}
let buktiBase64='';document.getElementById('bukti').addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=ev=>{buktiBase64=ev.target.result;document.getElementById('preview').src=buktiBase64;document.getElementById('preview').style.display='block';let list=JSON.parse(localStorage.getItem('dap_bukti')||'[]');list.push({img:buktiBase64,tgl:Date.now(),total:total});localStorage.setItem('dap_bukti',JSON.stringify(list));};r.readAsDataURL(f);});
function keWA(){if(!buktiBase64){alert('Upload bukti dulu');return}let teks=`Halo Owner DAP ORDER APK%0ATotal: Rp ${parseInt(total).toLocaleString()}%0ADANA: 082312728245 A/N MIY***N%0ASudah transfer, bukti saya kirim disini`;window.open(`https://wa.me/6283879195047?text=${teks}`,'_blank');}
let waktu=15*60;setInterval(()=>{let m=Math.floor(waktu/60);let s=waktu%60;document.getElementById('timer').innerText=`${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;if(waktu<=0)location.href='index.html';waktu--;},1000);
</script></body></html>
